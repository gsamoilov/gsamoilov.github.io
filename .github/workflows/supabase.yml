name: Deploy Supabase (database + functions)

# Runs when anything under supabase/ changes on main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check configuration
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing secret:SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing secret:SUPABASE_DB_PASSWORD"
          [ -n "$PROJECT_REF" ] || missing="$missing variable:SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply database migrations
        run: supabase db push
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
