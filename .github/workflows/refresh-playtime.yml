name: Daily playtime snapshot

# Saves everyone's "recently played" playtimes once a day, so Family Library games
# keep their last known hours after Steam's 2-week window. Can also be run by hand.
on:
  schedule:
    - cron: '23 4 * * *' # 04:23 UTC daily
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call refresh-playtime
        env:
          URL: ${{ vars.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$CRON_SECRET" ]; then echo "::error::Set variable SUPABASE_URL and secret CRON_SECRET"; exit 1; fi
          out=$(curl --fail-with-body -sS -X POST "$URL/functions/v1/refresh-playtime" -H "x-cron-secret: $CRON_SECRET")
          echo "$out"
          # Fail (so GitHub emails you) when the PlayStation token is broken or about to expire
          configured=$(echo "$out" | jq -r '.psn.configured')
          days=$(echo "$out" | jq -r '.psn.daysLeft')
          if [ "$configured" = "true" ] && [ "$days" = "null" ]; then
            echo "::error::PlayStation connection is broken. Get a new NPSSO token (walkthrough part B) and update the PSN_NPSSO secret in Supabase."; exit 1
          fi
          if [ "$configured" = "true" ] && [ "$days" -lt 7 ]; then
            echo "::error::PlayStation token expires in $days days. Get a new NPSSO token (walkthrough part B) and update PSN_NPSSO in Supabase."; exit 1
          fi
