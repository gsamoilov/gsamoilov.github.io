name: Daily playtime snapshot

# Saves everyone's "recently played" playtimes once a day, so Family Library games
# keep their last known hours after Steam's 2-week window. Can also be run by hand.
on:
  schedule:
    - cron: '23 4 * * *' # 04:23 UTC daily
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call refresh-playtime
        env:
          URL: ${{ vars.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$CRON_SECRET" ]; then echo "::error::Set variable SUPABASE_URL and secret CRON_SECRET"; exit 1; fi
          curl --fail-with-body -sS -X POST "$URL/functions/v1/refresh-playtime" -H "x-cron-secret: $CRON_SECRET"
