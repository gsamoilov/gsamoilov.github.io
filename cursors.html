<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursor lab | Greg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0705;--ink:#fff4e8;--muted:#b9a08c;--line:rgba(255,190,140,.16);--yellow:#ffb703;--orange:#ff6b00;--red:#ff3d1f;
  --font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font);touch-action:none;
  background-image:linear-gradient(rgba(255,170,100,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,170,100,.06) 1px,transparent 1px);
  background-size:48px 48px}
body.hide,body.hide *{cursor:none!important}
/* canvas CSS size must match the viewport, otherwise hi-dpi screens draw everything offset */
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:1;pointer-events:none}
.bar{position:fixed;top:0;left:0;right:0;z-index:5;padding:18px clamp(16px,4vw,40px)}
.bar a{color:var(--muted);text-decoration:none;transition:color .2s}
.bar a:hover{color:var(--ink)}
.center{position:fixed;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;pointer-events:none}
.center h1{font-size:clamp(2.6rem,10vw,8rem);letter-spacing:-.05em;line-height:1}
.center p{color:var(--muted);margin-top:14px;font-size:1.1rem}
.dock{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
  width:min(94vw,680px);padding:10px;border:1px solid var(--line);border-radius:26px;background:rgba(255,140,60,.08);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.dock button{font:inherit;color:var(--ink);background:none;border:1px solid transparent;border-radius:99px;padding:8px 18px;cursor:pointer;transition:background .2s}
.dock button:hover{background:rgba(255,255,255,.1)}
.dock button[aria-pressed="true"]{background:linear-gradient(100deg,var(--yellow),var(--orange) 55%,var(--red));color:#1a0a04;font-weight:500}
a:focus-visible,button:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
</style>
</head>
<body>
<div class="bar"><a href="index.html">Back home</a></div>
<div class="center"><h1 id="title">Fluid</h1><p id="hint">Swirl your cursor around.</p></div>
<canvas id="cv"></canvas>
<div class="dock" id="dock" role="group" aria-label="Cursor effects"></div>

<script>
(function(){
  var cv=document.getElementById('cv'),c=cv.getContext('2d'),W=0,H=0;
  var M={x:innerWidth/2,y:innerHeight/2,hov:false};
  function resize(){var d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0)}
  resize();addEventListener('resize',resize);
  function hsl(h,s,l){ // returns [r,g,b] 0..1
    s/=100;l/=100;var a=s*Math.min(l,1-l);
    function f(n){var k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))}
    return [f(0),f(8),f(4)];
  }

  /* ---------- Fluid: Jos Stam "stable fluids" solver, dye drawn as soft pixels ---------- */
  var N=72,S=N+2,SZ=S*S;
  function IX(i,j){return i+S*j}
  var fu=new Float32Array(SZ),fv=new Float32Array(SZ),fu0=new Float32Array(SZ),fv0=new Float32Array(SZ),
      dye=[new Float32Array(SZ),new Float32Array(SZ),new Float32Array(SZ)],dye0=new Float32Array(SZ),
      pp=new Float32Array(SZ),dv=new Float32Array(SZ);
  var fcv=document.createElement('canvas');fcv.width=fcv.height=N;
  var fctx=fcv.getContext('2d'),img=fctx.createImageData(N,N);
  function bnd(b,x){
    for(var i=1;i<=N;i++){
      x[IX(0,i)]=b===1?-x[IX(1,i)]:x[IX(1,i)];x[IX(N+1,i)]=b===1?-x[IX(N,i)]:x[IX(N,i)];
      x[IX(i,0)]=b===2?-x[IX(i,1)]:x[IX(i,1)];x[IX(i,N+1)]=b===2?-x[IX(i,N)]:x[IX(i,N)];
    }
    x[IX(0,0)]=.5*(x[IX(1,0)]+x[IX(0,1)]);x[IX(0,N+1)]=.5*(x[IX(1,N+1)]+x[IX(0,N)]);
    x[IX(N+1,0)]=.5*(x[IX(N,0)]+x[IX(N+1,1)]);x[IX(N+1,N+1)]=.5*(x[IX(N,N+1)]+x[IX(N+1,N)]);
  }
  function project(u,v,p,div){
    var i,j,k;
    for(j=1;j<=N;j++)for(i=1;i<=N;i++){div[IX(i,j)]=-.5*(u[IX(i+1,j)]-u[IX(i-1,j)]+v[IX(i,j+1)]-v[IX(i,j-1)])/N;p[IX(i,j)]=0}
    bnd(0,div);bnd(0,p);
    for(k=0;k<12;k++){
      for(j=1;j<=N;j++)for(i=1;i<=N;i++)p[IX(i,j)]=(div[IX(i,j)]+p[IX(i-1,j)]+p[IX(i+1,j)]+p[IX(i,j-1)]+p[IX(i,j+1)])/4;
      bnd(0,p);
    }
    for(j=1;j<=N;j++)for(i=1;i<=N;i++){
      u[IX(i,j)]-=.5*N*(p[IX(i+1,j)]-p[IX(i-1,j)]);v[IX(i,j)]-=.5*N*(p[IX(i,j+1)]-p[IX(i,j-1)]);
    }
    bnd(1,u);bnd(2,v);
  }
  function advect(b,d,d0,u,v,dt){
    var dt0=dt*N,i,j,x,y,i0,j0,s1,t1;
    for(j=1;j<=N;j++)for(i=1;i<=N;i++){
      x=Math.min(N+.5,Math.max(.5,i-dt0*u[IX(i,j)]));y=Math.min(N+.5,Math.max(.5,j-dt0*v[IX(i,j)]));
      i0=x|0;j0=y|0;s1=x-i0;t1=y-j0;
      d[IX(i,j)]=(1-s1)*((1-t1)*d0[IX(i0,j0)]+t1*d0[IX(i0,j0+1)])+s1*((1-t1)*d0[IX(i0+1,j0)]+t1*d0[IX(i0+1,j0+1)]);
    }
    bnd(b,d);
  }
  function fluidStep(){
    project(fu,fv,pp,dv);
    fu0.set(fu);fv0.set(fv);
    advect(1,fu,fu0,fu0,fv0,.12);advect(2,fv,fv0,fu0,fv0,.12);
    project(fu,fv,pp,dv);
    for(var c3=0;c3<3;c3++){dye0.set(dye[c3]);advect(0,dye[c3],dye0,fu,fv,.12)}
    for(var k=0;k<SZ;k++){fu[k]*=.996;fv[k]*=.996;dye[0][k]*=.985;dye[1][k]*=.985;dye[2][k]*=.985}
  }

  var lx=0,ly=0,have=false;
  var fx={
    fluid:{label:'Fluid',hint:'Swirl your cursor around.',native:true,
      reset:function(){[fu,fv,fu0,fv0].concat(dye).forEach(function(a){a.fill(0)});have=false},
      move:function(x,y){
        if(!have){lx=x;ly=y;have=true;return}
        var gx=x/W*N+1,gy=y/H*N+1,dx=(x-lx)/W*N,dy=(y-ly)/H*N;lx=x;ly=y;
        var t=performance.now(),col=hsl(10+22*(1+Math.sin(t/700)),100,55);
        for(var j=-2;j<=2;j++)for(var i=-2;i<=2;i++){
          var ci=Math.round(gx)+i,cj=Math.round(gy)+j;if(ci<1||cj<1||ci>N||cj>N)continue;
          var f=Math.max(0,1-Math.hypot(i,j)/3),k=IX(ci,cj);
          fu[k]+=dx*2.2*f;fv[k]+=dy*2.2*f;
          dye[0][k]+=col[0]*.55*f;dye[1][k]+=col[1]*.55*f;dye[2][k]+=col[2]*.55*f;
        }
      },
      draw:function(){
        fluidStep();
        var d=img.data,r=dye[0],g=dye[1],b=dye[2];
        for(var j=1;j<=N;j++)for(var i=1;i<=N;i++){
          var k=IX(i,j),o=((j-1)*N+(i-1))*4,m=Math.max(r[k],g[k],b[k]);
          d[o]=Math.min(255,r[k]*255);d[o+1]=Math.min(255,g[k]*255);d[o+2]=Math.min(255,b[k]*255);
          d[o+3]=Math.min(255,m*340);
        }
        fctx.putImageData(img,0,0);
        c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
        c.drawImage(fcv,0,0,W,H);
      }},

    ribbon:{label:'Ribbon',hint:'Glowing, tapered, silky.',native:true,pts:[],hx:0,hy:0,
      reset:function(){this.pts=[];this.hx=M.x;this.hy=M.y},
      draw:function(now){
        this.hx+=(M.x-this.hx)*.4;this.hy+=(M.y-this.hy)*.4; // eased head keeps the line smooth
        var p=this.pts;p.push({x:this.hx,y:this.hy,t:now});
        while(p.length&&now-p[0].t>800)p.shift();
        c.lineCap='round';c.lineJoin='round';c.globalCompositeOperation='lighter';c.shadowBlur=22;
        for(var i=1;i<p.length-1;i++){
          var k=1-(now-p[i].t)/800,m1x=(p[i-1].x+p[i].x)/2,m1y=(p[i-1].y+p[i].y)/2,m2x=(p[i].x+p[i+1].x)/2,m2y=(p[i].y+p[i+1].y)/2,
              h=10+((now/14+i*1.5)%45);
          c.strokeStyle='hsla('+h+',100%,58%,'+(.25+.75*k)+')';c.shadowColor='hsl('+h+',100%,55%)';
          c.lineWidth=1+20*k*k;
          c.beginPath();c.moveTo(m1x,m1y);c.quadraticCurveTo(p[i].x,p[i].y,m2x,m2y);c.stroke();
        }
        c.shadowBlur=0;c.globalCompositeOperation='source-over';
      }},

    swarm:{label:'Swarm',hint:'They chase you. Slow down and watch.',native:true,persist:true,p:[],
      reset:function(){
        this.p=[];for(var i=0;i<420;i++)this.p.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0});
      },
      draw:function(){
        c.globalCompositeOperation='destination-out';c.fillStyle='rgba(0,0,0,.12)';c.fillRect(0,0,W,H);
        c.globalCompositeOperation='lighter';c.lineWidth=1.6;c.lineCap='round';
        this.p.forEach(function(q){
          var dx=M.x-q.x,dy=M.y-q.y,d=Math.sqrt(dx*dx+dy*dy)+1,pull=120/(d+30),sw=70/(d+60);
          q.vx=(q.vx+dx/d*pull-dy/d*sw+(Math.random()-.5)*.3)*.955;
          q.vy=(q.vy+dy/d*pull+dx/d*sw+(Math.random()-.5)*.3)*.955;
          var ox=q.x,oy=q.y;q.x+=q.vx;q.y+=q.vy;
          var sp=Math.hypot(q.vx,q.vy);
          c.strokeStyle='hsla('+Math.min(55,12+sp*4)+',100%,'+(52+Math.min(20,sp*2))+'%,.9)';
          c.beginPath();c.moveTo(ox,oy);c.lineTo(q.x,q.y);c.stroke();
        });
        c.globalCompositeOperation='source-over';
      }},

    spot:{label:'Spotlight',hint:'Find the grid.',native:true,r:150,
      reset:function(){},
      draw:function(){
        c.fillStyle='rgba(12,7,5,.95)';c.fillRect(0,0,W,H);
        this.r+=((M.hov?230:150)-this.r)*.12;
        var g=c.createRadialGradient(M.x,M.y,0,M.x,M.y,this.r);
        g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.55,'rgba(0,0,0,.9)');g.addColorStop(1,'rgba(0,0,0,0)');
        c.globalCompositeOperation='destination-out';c.fillStyle=g;
        c.beginPath();c.arc(M.x,M.y,this.r,0,6.283);c.fill();
        c.globalCompositeOperation='source-over';
      }},

    ring:{label:'Ring',hint:'Hover the buttons below.',native:false,rx:0,ry:0,rr:16,
      reset:function(){this.rx=M.x;this.ry=M.y},
      draw:function(){
        this.rx+=(M.x-this.rx)*.16;this.ry+=(M.y-this.ry)*.16;
        this.rr+=((M.hov?40:16)-this.rr)*.2;
        c.beginPath();c.arc(this.rx,this.ry,this.rr,0,6.283);
        c.lineWidth=2;c.strokeStyle='#ffb703';c.stroke();
        if(M.hov){c.fillStyle='rgba(255,140,40,.2)';c.fill()}
        c.beginPath();c.arc(M.x,M.y,4,0,6.283);c.fillStyle='#fff4e8';c.fill();
      }},

    ripple:{label:'Ripples',hint:'Click or tap anywhere.',native:true,p:[],
      reset:function(){this.p=[]},
      click:function(x,y){var t=performance.now();this.p.push({x:x,y:y,t:t},{x:x,y:y,t:t+140},{x:x,y:y,t:t+280})},
      draw:function(now){
        var p=this.p=this.p.filter(function(r){return now-r.t<1300});
        c.globalCompositeOperation='lighter';
        p.forEach(function(r){
          var k=Math.max(0,(now-r.t)/1300),e=1-Math.pow(1-k,3);
          c.beginPath();c.arc(r.x,r.y,e*220,0,6.283);
          c.lineWidth=2+8*(1-k);c.strokeStyle='hsla('+(10+k*45)+',100%,58%,'+(1-k)*.9+')';c.stroke();
        });
        c.globalCompositeOperation='source-over';
      }}
  };

  var names=Object.keys(fx),eff=null,dock=document.getElementById('dock'),btns={};
  names.forEach(function(n,i){
    var b=document.createElement('button');b.type='button';b.textContent=fx[n].label;b.title='Press '+(i+1);
    b.addEventListener('click',function(){pick(n)});dock.appendChild(b);btns[n]=b;
  });
  function pick(n){
    eff=fx[n];c.clearRect(0,0,W,H);if(eff.reset)eff.reset();
    document.body.classList.toggle('hide',!eff.native);
    document.getElementById('title').textContent=eff.label;
    document.getElementById('hint').textContent=eff.hint;
    names.forEach(function(k){btns[k].setAttribute('aria-pressed',k===n)});
  }

  addEventListener('pointermove',function(e){
    M.x=e.clientX;M.y=e.clientY;M.hov=!!(e.target.closest&&e.target.closest('button,a'));
    if(eff.move)eff.move(M.x,M.y);
  });
  addEventListener('pointerdown',function(e){M.x=e.clientX;M.y=e.clientY;if(eff.click)eff.click(M.x,M.y)});
  addEventListener('keydown',function(e){var i=parseInt(e.key,10)-1;if(names[i])pick(names[i])});

  function loop(now){
    if(!eff.persist)c.clearRect(0,0,W,H);
    eff.draw(now);
    requestAnimationFrame(loop);
  }
  pick('fluid');requestAnimationFrame(loop);
})();
</script>
</body>
</html>
