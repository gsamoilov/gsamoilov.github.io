<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouncing logo | Greg</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0c0705;color:#fff4e8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#world{position:fixed;inset:0;overflow:hidden}
#logo,.orb{position:absolute;top:0;left:0;user-select:none;-webkit-user-drag:none;will-change:transform}
.orb{opacity:0;pointer-events:none;filter:drop-shadow(0 0 14px rgba(255,107,0,.7))}
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,4vw,40px);pointer-events:none}
.bar>*{pointer-events:auto}
.bar a{color:#b9a08c;text-decoration:none;transition:color .2s}
.bar a:hover{color:#fff4e8}
.bar a:focus-visible,#pause:focus-visible{outline:2px solid #ffb703;outline-offset:3px}
#score{color:#b9a08c;font-variant-numeric:tabular-nums}
#pause{background:none;border:1px solid rgba(255,255,255,.18);color:#fff4e8;border-radius:99px;padding:6px 16px;font:inherit;cursor:pointer}
#pause:hover{background:rgba(255,255,255,.08)}
.flash{position:fixed;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none;transition:opacity .8s}
.flash.on{opacity:.5;transition:none}
#pop{position:fixed;left:50%;top:50%;z-index:4;font-size:clamp(3rem,14vw,10rem);font-weight:800;letter-spacing:-.04em;
  transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;text-shadow:0 0 40px #ff6b00}
#pop.go{animation:pop 1.2s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
</style>
</head>
<body>
<div class="bar">
  <a href="index.html">Back home</a>
  <span id="score">Corner hits: 0</span>
  <button id="pause" type="button">Pause</button>
</div>
<div id="world"><img id="logo" alt="Bouncing logo" draggable="false"></div>
<div class="flash" id="flash"></div>
<div id="pop" aria-hidden="true">CORNER!</div>

<script>
(function(){
  var SRC=['images/background.png','images/background2.png','images/background3.png','images/background4.png'];
  var logo=document.getElementById('logo'), world=document.getElementById('world'),
      score=document.getElementById('score'), flash=document.getElementById('flash'),
      pop=document.getElementById('pop'), btn=document.getElementById('pause');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  var pics=SRC.map(function(s){var im=new Image();im.src=s;return im});
  var cur=1, x=0,y=0,vx=170,vy=140,w=0,h=0,hits=0,paused=false,last=0;
  var tShake=99999,tPulse=99999,tOrb=99999,ang=0,orbiting=false,DUR=3800;

  // 6 orbiting pics: two rings of three
  var orbs=[];
  for(var k=0;k<6;k++){var o=document.createElement('img');o.className='orb';o.alt='';o.draggable=false;world.appendChild(o);orbs.push(o)}

  function ratio(i){var im=pics[i];return im.naturalWidth?im.naturalHeight/im.naturalWidth:1}
  function setSize(){
    w=Math.min(220,Math.max(110,innerWidth*.16));
    h=w;

    logo.style.width=w+'px';
    logo.style.height=h+'px';
    logo.style.objectFit='cover';
}
  function swap(){
    var n;do{n=Math.floor(Math.random()*SRC.length)}while(n===cur);
    cur=n;logo.src=SRC[cur];setSize();
    x=Math.min(x,Math.max(0,innerWidth-w));y=Math.min(y,Math.max(0,innerHeight-h));
  }
  function startOrbit(){
    var others=[0,1,2,3].filter(function(i){return i!==cur});
    orbs.forEach(function(o,k){o.src=SRC[others[k%3]];o.style.width=(w*.55)+'px'});
    tOrb=0;ang=0;orbiting=true;
  }
  function cornerHit(){
    hits++;score.textContent='Corner hits: '+hits;
    startOrbit();tPulse=0;
    pop.classList.remove('go');void pop.offsetWidth;pop.classList.add('go');
    if(!reduce){
      tShake=0;
      flash.style.background='hsl('+Math.floor(Math.random()*360)+',100%,65%)';
      flash.classList.add('on');
      requestAnimationFrame(function(){requestAnimationFrame(function(){flash.classList.remove('on')})});
    }
  }

  function tick(now){
    if(!last)last=now;
    var dt=Math.min(.05,(now-last)/1000);last=now;
    if(!paused){
      var ms=dt*1000;tShake+=ms;tPulse+=ms;tOrb+=ms;
      x+=vx*dt;y+=vy*dt;
      var hx=false,hy=false,mx=innerWidth-w,my=innerHeight-h;
      if(x<=0){x=0;vx=Math.abs(vx);hx=true}else if(x>=mx){x=Math.max(0,mx);vx=-Math.abs(vx);hx=true}
      if(y<=0){y=0;vy=Math.abs(vy);hy=true}else if(y>=my){y=Math.max(0,my);vy=-Math.abs(vy);hy=true}
      if(hx||hy)swap();
      if(hx&&hy)cornerHit();

      // shake
      if(tShake<1000){var a=20*Math.pow(1-tShake/1000,2);world.style.transform='translate('+((Math.random()-.5)*a)+'px,'+((Math.random()-.5)*a)+'px)'}
      else if(world.style.transform)world.style.transform='';

      // logo pulse
      var sc=tPulse<700?1+.4*(1-tPulse/700):1;
      logo.style.transform='translate('+x+'px,'+y+'px) scale('+sc+')';

      // orbiters: spin fast, slow down, fade out
      if(orbiting){
        var p=tOrb/DUR;
        if(p>=1){orbs.forEach(function(o){o.style.opacity=0});orbiting=false}
        else{
          var om=22*Math.pow(1-p,2.4)+.5*(1-p);ang+=om*dt;
          var op=p<.55?1:Math.max(0,1-(p-.55)/.45);
          var cx=x+w/2,cy=y+h/2;
          orbs.forEach(function(o,k){
            var ring=k>=3?1:0,j=k%3,
                a=(ring?-ang:ang)+j*2*Math.PI/3+ring*Math.PI/3,
                r=(w*.85+ring*w*.5)*(.7+.5*Math.min(1,p*2));
            o.style.opacity=op;
            o.style.transform='translate('+(cx+r*Math.cos(a))+'px,'+(cy+r*Math.sin(a))+'px) translate(-50%,-50%) rotate('+(a+Math.PI/2)+'rad)';
          });
        }
      }
    }
    requestAnimationFrame(tick);
  }

  function start(){
    logo.src=SRC[cur];setSize();
    x=Math.random()*Math.max(1,innerWidth-w);y=Math.random()*Math.max(1,innerHeight-h);
    if(Math.random()<.5)vx=-vx;if(Math.random()<.5)vy=-vy;
    requestAnimationFrame(tick);
  }

  btn.addEventListener('click',function(){paused=!paused;btn.textContent=paused?'Resume':'Pause';last=0});
  addEventListener('resize',setSize);
  var first=pics[cur];
  if(first.complete&&first.naturalWidth)start();
  else{first.addEventListener('load',start);first.addEventListener('error',function(){score.textContent='Could not load images/background2.png'})}
})();
</script>
</body>
</html>
