<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouncing logo | Greg</title>
<link rel="icon" type="image/png" href="/images/favicon.png?v=2">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0c0705;color:#fff4e8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#world{position:fixed;inset:0;overflow:hidden}

#logo,.orb{
  position:absolute;
  top:0;
  left:0;
  user-select:none;
  -webkit-user-drag:none;
  will-change:transform
}

#logo{
  --c:#ff6b00;
  background:var(--c);
  -webkit-mask:url('/images/dvd.png') center/100% 100% no-repeat;
  mask:url('/images/dvd.png') center/100% 100% no-repeat;
  filter:drop-shadow(0 0 14px var(--c));
}
}

.orb{
  opacity:0;
  pointer-events:none;
  filter:drop-shadow(0 0 14px rgba(255,107,0,.7))
}

/* WALL GLOW: static bar on the wall where the logo hit, holds, then fades */
.wall{position:absolute;pointer-events:none;z-index:2;filter:drop-shadow(0 0 8px #ff8a2a);animation:wallFade 2.8s ease-out forwards}
.wall-l,.wall-r{width:90px}
.wall-t,.wall-b{height:90px}
.wall-l{border-left:4px solid #fff3d6;background:linear-gradient(90deg,rgba(255,150,50,.6),rgba(255,107,0,.18) 40%,transparent)}
.wall-r{border-right:4px solid #fff3d6;background:linear-gradient(270deg,rgba(255,150,50,.6),rgba(255,107,0,.18) 40%,transparent)}
.wall-t{border-top:4px solid #fff3d6;background:linear-gradient(180deg,rgba(255,150,50,.6),rgba(255,107,0,.18) 40%,transparent)}
.wall-b{border-bottom:4px solid #fff3d6;background:linear-gradient(0deg,rgba(255,150,50,.6),rgba(255,107,0,.18) 40%,transparent)}
@keyframes wallFade{0%{opacity:1}60%{opacity:1}100%{opacity:0}}

.bar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:5;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px clamp(16px,4vw,40px);
  pointer-events:none
}

.bar>*{pointer-events:auto}
.bar a{color:#b9a08c;text-decoration:none;transition:color .2s}
.bar a:hover{color:#fff4e8}
.bar a:focus-visible,#pause:focus-visible{outline:2px solid #ffb703;outline-offset:3px}
#score{color:#b9a08c;font-variant-numeric:tabular-nums}

#pause{
  background:none;
  border:1px solid rgba(255,255,255,.18);
  color:#fff4e8;
  border-radius:99px;
  padding:6px 16px;
  font:inherit;
  cursor:pointer
}

#pause:hover{background:rgba(255,255,255,.08)}

.flash{
  position:fixed;
  inset:0;
  z-index:4;
  background:#fff;
  opacity:0;
  pointer-events:none;
  transition:opacity .8s
}

.flash.on{opacity:.5;transition:none}

#pop{
  position:fixed;
  left:50%;
  top:50%;
  z-index:4;
  font-size:clamp(3rem,14vw,10rem);
  font-weight:800;
  letter-spacing:-.04em;
  transform:translate(-50%,-50%) scale(.5);
  opacity:0;
  pointer-events:none;
  text-shadow:0 0 40px #ff6b00
}

#pop.go{animation:pop 1.2s ease-out}

@keyframes pop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}
}
</style>
</head>

<body>

<div class="bar">
  <a href="/">Back home</a>
  <span id="score">Corner hits: 0</span>
  <button id="pause" type="button">Pause</button>
</div>

<div id="world">
 <div id="logo" role="img" aria-label="Bouncing logo"></div>
</div>

<div class="flash" id="flash"></div>
<div id="pop" aria-hidden="true">CORNER!</div>

<script>
(function(){

  var SRC=[
    '/images/background.png',
    '/images/background2.png',
    '/images/background3.png',
    '/images/background4.png'
  ];

  var logo=document.getElementById('logo'),
      world=document.getElementById('world'),
      score=document.getElementById('score'),
      flash=document.getElementById('flash'),
      pop=document.getElementById('pop'),
      btn=document.getElementById('pause');

  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  var pics=SRC.map(function(s){
    var im=new Image();
    im.src=s;
    return im;
  });

  var cur=1,
      x=0,y=0,
      vx=170,vy=140,
      w=0,h=0,
      hits=0,
      paused=false,
      last=0;

  var tPulse=99999,
      tOrb=99999,
      ang=0,
      orbiting=false,
      DUR=3800,
      lastWallHit=0;

  // RECTANGULAR LOGO SIZE (3:2)

function setSize(){
  var im=pics[cur],
      s=Math.min(1,innerWidth*.5/im.naturalWidth,innerHeight*.5/im.naturalHeight);
  w=im.naturalWidth*s;
  h=im.naturalHeight*s;
  logo.style.width=w+'px';
  logo.style.height=h+'px';
}

  // 6 ORBITING PICTURES

  var orbs=[];

  for(var k=0;k<12;k++){
    var o=document.createElement('img');
    o.className='orb';
    o.alt='';
    o.draggable=false;
    world.appendChild(o);
    orbs.push(o);
  }

  function swap(){
  var hue=Math.floor(Math.random()*360);
  logo.style.setProperty('--c','hsl('+hue+',100%,60%)');
}

  // WALL IMPACT GLOW

 function wallImpact(horizontal){
  if(reduce)return;
  var d=document.createElement('div'),side;
  if(horizontal){
    side=x<innerWidth/2?'l':'r';
    d.style.top=y+'px';
    d.style.height=h+'px';
    d.style[side==='l'?'left':'right']='0';
  }else{
    side=y<innerHeight/2?'t':'b';
    d.style.left=x+'px';
    d.style.width=w+'px';
    d.style[side==='t'?'top':'bottom']='0';
  }
  d.className='wall wall-'+side;
  world.appendChild(d);
  setTimeout(function(){d.remove()},2900);
}

  // ORBIT ANIMATION

  function startOrbit(){

    var others=[0,1,2,3].filter(function(i){
      return i!==cur;
    });

    orbs.forEach(function(o,k){
      o.src=SRC[others[k%3]];
      o.style.width=(w*.55)+'px';
    });

    tOrb=0;
    ang=0;
    orbiting=true;
  }

  // CORNER HIT

  function cornerHit(){

    hits++;
    score.textContent='Corner hits: '+hits;

    startOrbit();
    tPulse=0;

    pop.classList.remove('go');
    void pop.offsetWidth;
    pop.classList.add('go');

    if(!reduce){

      flash.style.background='rgba(255,190,110,.8)';
      flash.classList.add('on');

      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          flash.classList.remove('on');
        });
      });
    }
  }

  // MAIN ANIMATION LOOP

  function tick(now){

    if(!last)last=now;

    var dt=Math.min(.05,(now-last)/1000);
    last=now;

    if(!paused){

      tPulse+=dt*1000;
      tOrb+=dt*1000;

      x+=vx*dt;
      y+=vy*dt;

      var hx=false,
          hy=false,
          mx=innerWidth-w,
          my=innerHeight-h;

      // HORIZONTAL COLLISIONS

      if(x<=0){
        x=0;
        vx=Math.abs(vx);
        hx=true;
        wallImpact(true);
      }
      else if(x>=mx){
        x=Math.max(0,mx);
        vx=-Math.abs(vx);
        hx=true;
        wallImpact(true);
      }

      // VERTICAL COLLISIONS

      if(y<=0){
        y=0;
        vy=Math.abs(vy);
        hy=true;
        wallImpact(false);
      }
      else if(y>=my){
        y=Math.max(0,my);
        vy=-Math.abs(vy);
        hy=true;
        wallImpact(false);
      }

      if(hx||hy){
        swap();
        tPulse=0;
      }

      // CORNER DETECTION

      var nearX=x<=24||x>=mx-24;
      var nearY=y<=24||y>=my-24;

      if(
        (hx&&hy) ||
        ((hx||hy)&&nearX&&nearY&&now-lastWallHit>250)
      ){
        cornerHit();
        lastWallHit=now;
      }

      // LOGO PULSE

    logo.style.transform='translate('+x+'px,'+y+'px)';

      // ORBITERS

      if(orbiting){

        var p=tOrb/DUR;

        if(p>=1){

          orbs.forEach(function(o){
            o.style.opacity=0;
          });

          orbiting=false;

        }else{

          var om=22*Math.pow(1-p,2.4)+.5*(1-p);

          ang+=om*dt;

          var op=p<.55?1:Math.max(0,1-(p-.55)/.45);

          var cx=x+w/2,
              cy=y+h/2;

          orbs.forEach(function(o,k){

            var ring=k>=6?1:0,
                j=k%6,
                a=(ring?-ang:ang)+j*2*Math.PI/6+ring*Math.PI/6,
                r=(w*.85+ring*w*.5)*(.7+.5*Math.min(1,p*2));

            o.style.opacity=op;

            o.style.transform=
              'translate('+
              (cx+r*Math.cos(a))+'px,'+
              (cy+r*Math.sin(a))+'px) '+
              'translate(-50%,-50%) rotate('+
              (a+Math.PI/2)+'rad)';
          });
        }
      }
    }

    requestAnimationFrame(tick);
  }

  // START

  function start(){

    swap();

    setSize();

    x=Math.random()*Math.max(1,innerWidth-w);
    y=Math.random()*Math.max(1,innerHeight-h);

    if(Math.random()<.5)vx=-vx;
    if(Math.random()<.5)vy=-vy;

    requestAnimationFrame(tick);
  }

  // PAUSE BUTTON

  btn.addEventListener('click',function(){

    paused=!paused;

    btn.textContent=paused?'Resume':'Pause';

    last=0;
  });

  addEventListener('resize',setSize);

  // SECRET DEBUG MENU: TYPE "debug"

  (function(){

    var st=document.createElement('style');

    st.textContent=
      '#dbg{position:fixed;right:16px;bottom:16px;z-index:9;display:none;width:220px;padding:14px;border:1px solid rgba(255,190,140,.3);border-radius:16px;background:rgba(20,10,6,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff4e8;font:14px system-ui,sans-serif}'+
      '#dbg.open{display:block}'+
      '#dbg b{display:block;margin-bottom:8px}'+
      '#dbg .g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}'+
      '#dbg button{font:inherit;color:#fff4e8;background:rgba(255,255,255,.08);border:1px solid rgba(255,190,140,.25);border-radius:10px;padding:7px;cursor:pointer}'+
      '#dbg button:hover{background:rgba(255,140,40,.3)}'+
      '#dbg .w{width:100%;margin-bottom:6px}';

    document.head.appendChild(st);

    var m=document.createElement('div');
    m.id='dbg';

    m.innerHTML=
      '<b>Debug</b><div class="g">'+
      '<button data-c="tl">Top left</button><button data-c="tr">Top right</button>'+
      '<button data-c="bl">Bottom left</button><button data-c="br">Bottom right</button></div>'+
      '<button class="w" data-c="fire">Fire corner animation</button>'+
      '<button class="w" data-c="close">Close</button>';

    document.body.appendChild(m);

    function go(c){

      var right=c.charAt(1)==='r',
          bottom=c.charAt(0)==='b';

      x=right?Math.max(0,innerWidth-w-1):1;
      y=bottom?Math.max(0,innerHeight-h-1):1;

      vx=right?Math.abs(vx):-Math.abs(vx);
      vy=bottom?Math.abs(vy):-Math.abs(vy);

      if(paused){
        paused=false;
        btn.textContent='Pause';
        last=0;
      }
    }

    m.addEventListener('click',function(e){

      var c=e.target.getAttribute&&e.target.getAttribute('data-c');

      if(!c)return;

      if(c==='close')m.classList.remove('open');
      else if(c==='fire')cornerHit();
      else go(c);
    });

    var buf='';

    addEventListener('keydown',function(e){

      if(e.key==='Escape'){
        m.classList.remove('open');
        return;
      }

      if(e.key.length!==1)return;

      buf=(buf+e.key.toLowerCase()).slice(-5);

      if(buf==='debug'){
        m.classList.toggle('open');
        buf='';
      }
    });

  })();

  var first=pics[cur];

  if(first.complete&&first.naturalWidth){
    start();
  }
  else{

    first.addEventListener('load',start);

    first.addEventListener('error',function(){
      score.textContent='Could not load images/background2.png';
    });

  }

})();
</script>

</body>
</html>
