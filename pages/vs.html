<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VS arena | Greg</title>
<link rel="icon" type="image/png" href="/images/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0705;--ink:#fff4e8;--muted:#b9a08c;--yellow:#ffb703;--orange:#ff6b00;--red:#ff3d1f;
  --g-bg:rgba(255,100,20,.07);--g-bd:rgba(255,150,60,.35);--g-sh:0 0 40px rgba(255,80,0,.14),inset 0 1px 0 rgba(255,220,180,.16);
  --font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;min-height:100vh;overflow-x:hidden}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.glow i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.3}
.glow i:nth-child(1){width:46vw;height:46vw;background:var(--red);top:-12vw;left:-10vw}
.glow i:nth-child(2){width:40vw;height:40vw;background:var(--yellow);bottom:-14vw;right:-8vw;opacity:.2}
main{max-width:1000px;margin:0 auto;padding:70px clamp(16px,4vw,36px) 90px}
.back{position:absolute;top:24px;left:clamp(16px,4vw,36px);color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
h1{font-size:clamp(3rem,12vw,7rem);letter-spacing:-.05em;line-height:1;background:linear-gradient(100deg,var(--ink) 10%,var(--yellow) 50%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:10px 0 22px;max-width:60ch}
.glass{position:relative;overflow:hidden;background:var(--g-bg);border:1px solid var(--g-bd);box-shadow:var(--g-sh);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

.modes{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.modes span{color:var(--muted);font-size:.9rem;margin-right:6px}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:720px){.setup{grid-template-columns:1fr}}
.side{padding:22px;border-radius:22px;border-color:color-mix(in srgb,var(--col) 55%,transparent)}
.side h2{font-size:1.2rem;margin-bottom:14px;color:var(--col)}
.drop{display:grid;place-items:center;width:170px;height:170px;margin:0 auto 14px;border-radius:50%;border:2px dashed var(--g-bd);cursor:pointer;
  text-align:center;color:var(--muted);font-size:.9rem;padding:14px;overflow:hidden;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--yellow);background:rgba(255,160,60,.1)}
.drop.has{border-style:solid;border-color:var(--col);padding:0}
.drop img{width:100%;height:100%;object-fit:cover}
.name{width:100%;font:inherit;color:var(--ink);background:rgba(127,127,127,.12);border:1px solid var(--g-bd);border-radius:12px;padding:9px 14px;margin-bottom:14px}
.label{font-size:.85rem;color:var(--muted);margin:10px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--g-bd);border-radius:99px;padding:7px 14px;cursor:pointer;transition:background .2s}
.chip:hover{background:rgba(255,160,60,.18)}
.chip[aria-pressed="true"]{background:linear-gradient(100deg,var(--yellow),var(--orange) 60%,var(--red));color:#1a0a04;border-color:transparent;font-weight:500}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}

.actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:24px 0 8px}
.btn{font:inherit;font-weight:500;color:var(--ink);padding:14px 34px;border-radius:99px;cursor:pointer;border:1px solid rgba(255,180,90,.6);
  background:linear-gradient(100deg,rgba(255,183,3,.3),rgba(255,107,0,.28) 55%,rgba(255,61,31,.3));transition:transform .2s,box-shadow .2s}
.btn:hover:not(:disabled){transform:scale(1.04);box-shadow:0 0 36px rgba(255,100,0,.4)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;border-color:var(--g-bd)}
.link{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer}
.link:hover{color:var(--ink)}
#hint{color:var(--muted);font-size:.9rem}

.arena{position:relative;margin-top:40px;border-radius:22px;padding:10px}
canvas{display:block;width:100%;height:auto;border-radius:14px;background:#0c0705}
#over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(12,7,5,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#over h2{font-size:clamp(2rem,7vw,4rem);letter-spacing:-.03em}
#over .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><i></i><i></i></div>
<main>
  <a class="back" href="/">Back home</a>
  <h1>VS</h1>
  <p class="sub">Upload two fighters and let them settle it. Use quick presets, or build a loadout Skyrim-style with a weapon in one hand and a spell in the other, or a two-handed weapon or heavy spell. The fight runs itself. Your images stay on your device.</p>

  <div class="modes" role="group" aria-label="Mode">
    <span>Mode</span>
    <button class="chip" type="button" data-mode="presets" aria-pressed="true">Presets</button>
    <button class="chip" type="button" data-mode="custom" aria-pressed="false">Custom build</button>
  </div>

  <div class="setup" id="setup"></div>

  <div class="actions">
    <button class="btn" id="go" type="button" disabled>Fight!</button>
    <button class="link" id="sample" type="button">No images handy? Use sample fighters</button>
    <span id="hint"></span>
  </div>

  <section class="arena glass" id="arena" hidden>
    <canvas id="cv" width="1280" height="720"></canvas>
    <div id="over" hidden>
      <h2 id="wname"></h2>
      <div class="row">
        <button class="btn" id="again" type="button">Rematch</button>
        <button class="btn ghost" id="change" type="button">Change fighters</button>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var AW=960,AH=540,R=40,HP=120,TOP=78;

  /* ---------------- everything a fighter can use ---------------- */
  var POW={
    // presets
    katana:{label:'Katana',icon:'🗡️',cat:'preset',range:70,cd:.85,desc:'Dashes in and slashes'},
    gun:{label:'Gun',icon:'🔫',cat:'preset',range:290,reach:460,cd:.2,desc:'Rapid shots'},
    bomb:{label:'Explosives',icon:'💣',cat:'preset',range:330,reach:450,cd:1.8,desc:'Lobbed grenades'},
    bolt:{label:'Lightning',icon:'⚡',cat:'preset',range:300,reach:450,cd:.95,desc:'Instant bolt'},
    fire:{label:'Flamethrower',icon:'🔥',cat:'preset',range:140,reach:230,cd:.06,desc:'Short-range flames'},
    // right hand
    sword:{label:'Short sword',icon:'⚔️',cat:'rh',range:62,cd:.5,desc:'Fast, lunges at you'},
    waraxe:{label:'War axe',icon:'🪓',cat:'rh',range:70,cd:1.05,desc:'Slow, heavy hits'},
    mace:{label:'Mace',icon:'🔨',cat:'rh',range:68,cd:.9,desc:'Stuns on hit'},
    dagger:{label:'Dagger',icon:'🔪',cat:'rh',range:58,cd:.27,desc:'Very fast, light hits'},
    // left hand (spells)
    fireball:{label:'Fireball',icon:'🔥',cat:'lh',reach:400,cd:1.5,desc:'Sets the target on fire'},
    frost:{label:'Frost spike',icon:'❄️',cat:'lh',reach:380,cd:1.3,desc:'Slows the target'},
    shock:{label:'Lightning',icon:'⚡',cat:'lh',reach:380,cd:1.1,desc:'Instant bolt, can stun'},
    heal:{label:'Heal',icon:'💚',cat:'lh',cd:4.5,desc:'Restores health when hurt'},
    ward:{label:'Ward',icon:'🛡️',cat:'lh',cd:6.5,desc:'Blocks most damage for a moment'},
    summon:{label:'Summon wolves',icon:'🐺',cat:'lh',cd:11,desc:'Spirit wolves fight for you'},
    // two-handed weapons
    greataxe:{label:'Great-axe',icon:'🪓',cat:'two',range:80,cd:1.5,desc:'Huge hit that causes bleeding'},
    spear:{label:'Spear',icon:'🔱',cat:'two',range:110,cd:.7,desc:'Long reach. Throws itself for big damage'},
    warhammer:{label:'Warhammer',icon:'🔨',cat:'two',range:76,cd:1.7,desc:'Slam that stuns'},
    longbow:{label:'Longbow',icon:'🏹',cat:'two',range:330,reach:520,cd:.8,desc:'Long-range arrows'},
    // heavy spells (two-handed)
    meteor:{label:'Meteor strike',icon:'☄️',cat:'heavy',range:340,reach:480,cd:4.5,desc:'Calls meteors down on you'},
    blizzard:{label:'Blizzard',icon:'🌨️',cat:'heavy',range:330,reach:450,cd:6.5,desc:'Freezing storm that slows and hurts'},
    blackhole:{label:'Black hole',icon:'🕳️',cat:'heavy',range:320,reach:430,cd:7,desc:'Drags you in and crushes'}
  };
  function keys(cat){return Object.keys(POW).filter(function(k){return POW[k].cat===cat})}
  var COLS=['#ff6b00','#4fd1ff'],MODE='presets';
  var fighters=[
    {sprite:null,name:'Fighter 1',powers:['katana'],build:{hands:'one',rh:'sword',lh:'fireball',two:'greataxe'}},
    {sprite:null,name:'Fighter 2',powers:['gun'],build:{hands:'two',rh:'sword',lh:'none',two:'spear'}}
  ];
  var pv=[],dz=[];

  /* ---------------- setup UI ---------------- */
  var setup=$('setup');
  function paintP(i){[].forEach.call($('p'+i).children,function(b){b.setAttribute('aria-pressed',fighters[i].powers.indexOf(b.dataset.k)>=0)})}
  function paintC(i){
    var b=fighters[i].build;
    [].forEach.call($('seg'+i).children,function(x){x.setAttribute('aria-pressed',x.dataset.h===b.hands)});
    $('one'+i).hidden=b.hands!=='one';$('two'+i).hidden=b.hands!=='two';
    [].forEach.call($('rh'+i).children,function(x){x.setAttribute('aria-pressed',x.dataset.k===b.rh)});
    [].forEach.call($('lh'+i).children,function(x){x.setAttribute('aria-pressed',x.dataset.k===b.lh)});
    [].forEach.call($('tw'+i).children,function(x){x.setAttribute('aria-pressed',x.dataset.k===b.two)});
    [].forEach.call($('hv'+i).children,function(x){x.setAttribute('aria-pressed',x.dataset.k===b.two)});
  }
  function chips(box,list,onPick){
    list.forEach(function(k){
      var b=document.createElement('button');b.type='button';b.className='chip';b.dataset.k=k;
      b.textContent=POW[k]?POW[k].icon+' '+POW[k].label:'None';b.title=POW[k]?POW[k].desc:'Leave the left hand empty';
      b.addEventListener('click',function(){onPick(k)});box.appendChild(b);
    });
  }
  [0,1].forEach(function(i){
    var s=document.createElement('section');
    s.className='side glass';s.style.setProperty('--col',COLS[i]);
    s.innerHTML='<h2>Fighter '+(i+1)+'</h2>'+
      '<label class="drop" id="dz'+i+'"><input type="file" accept="image/*" id="f'+i+'" hidden><img id="pv'+i+'" alt="" hidden><span>Click or drop an image</span></label>'+
      '<input class="name" id="n'+i+'" maxlength="16" value="Fighter '+(i+1)+'" aria-label="Fighter '+(i+1)+' name">'+
      '<div class="pre" id="pre'+i+'"><div class="label">Powers (pick up to 2)</div><div class="chips" id="p'+i+'"></div></div>'+
      '<div class="cus" id="cus'+i+'" hidden>'+
        '<div class="seg" id="seg'+i+'"><button class="chip" type="button" data-h="one">One-handed + spell</button><button class="chip" type="button" data-h="two">Two-handed</button></div>'+
        '<div id="one'+i+'"><div class="label">Right hand: weapon</div><div class="chips" id="rh'+i+'"></div><div class="label">Left hand: spell</div><div class="chips" id="lh'+i+'"></div></div>'+
        '<div id="two'+i+'" hidden><div class="label">Two-handed weapons</div><div class="chips" id="tw'+i+'"></div><div class="label">Heavy spells</div><div class="chips" id="hv'+i+'"></div></div>'+
      '</div>';
    setup.appendChild(s);
    pv[i]=$('pv'+i);dz[i]=$('dz'+i);
    $('f'+i).addEventListener('change',function(e){loadFile(i,e.target.files[0])});
    dz[i].addEventListener('dragover',function(e){e.preventDefault();dz[i].classList.add('over')});
    dz[i].addEventListener('dragleave',function(){dz[i].classList.remove('over')});
    dz[i].addEventListener('drop',function(e){e.preventDefault();dz[i].classList.remove('over');loadFile(i,e.dataTransfer.files[0])});
    $('n'+i).addEventListener('input',function(e){fighters[i].name=e.target.value.trim()||('Fighter '+(i+1))});
    chips($('p'+i),keys('preset'),function(k){
      var ps=fighters[i].powers,ix=ps.indexOf(k);
      if(ix>=0)ps.splice(ix,1);else{ps.push(k);if(ps.length>2)ps.shift()}
      paintP(i);check();
    });
    chips($('rh'+i),keys('rh'),function(k){fighters[i].build.rh=k;paintC(i)});
    chips($('lh'+i),keys('lh').concat(['none']),function(k){fighters[i].build.lh=k;paintC(i)});
    chips($('tw'+i),keys('two'),function(k){fighters[i].build.two=k;paintC(i)});
    chips($('hv'+i),keys('heavy'),function(k){fighters[i].build.two=k;paintC(i)});
    [].forEach.call($('seg'+i).children,function(x){x.addEventListener('click',function(){fighters[i].build.hands=x.dataset.h;paintC(i)})});
    paintP(i);paintC(i);
  });
  [].forEach.call(document.querySelectorAll('[data-mode]'),function(b){
    b.addEventListener('click',function(){
      MODE=b.getAttribute('data-mode');
      [].forEach.call(document.querySelectorAll('[data-mode]'),function(o){o.setAttribute('aria-pressed',o===b)});
      [0,1].forEach(function(i){$('pre'+i).hidden=MODE!=='presets';$('cus'+i).hidden=MODE!=='custom'});
      check();
    });
  });
  function check(){
    var imgs=fighters.every(function(f){return f.sprite});
    var ok=imgs&&(MODE==='custom'||fighters.every(function(f){return f.powers.length}));
    $('go').disabled=!ok;
    $('hint').textContent=ok?'':(imgs?'Each fighter needs at least one power.':'Both fighters need an image.');
  }
  function toSprite(img){
    var c=document.createElement('canvas');c.width=c.height=256;
    var g=c.getContext('2d');g.beginPath();g.arc(128,128,128,0,6.2832);g.clip();
    var s=Math.min(img.naturalWidth,img.naturalHeight);
    g.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,256,256);
    return c;
  }
  function loadFile(i,file){
    if(!file||file.type.indexOf('image/')!==0)return;
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){fighters[i].sprite=toSprite(im);pv[i].src=url;pv[i].hidden=false;dz[i].classList.add('has');check()};
    im.src=url;
  }
  function sample(i,emoji,c1,c2){
    var c=document.createElement('canvas');c.width=c.height=256;
    var g=c.getContext('2d'),gr=g.createLinearGradient(0,0,256,256);
    gr.addColorStop(0,c1);gr.addColorStop(1,c2);
    g.fillStyle=gr;g.beginPath();g.arc(128,128,128,0,6.2832);g.fill();
    g.font='150px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(emoji,128,138);
    fighters[i].sprite=c;pv[i].src=c.toDataURL();pv[i].hidden=false;dz[i].classList.add('has');
  }
  $('sample').addEventListener('click',function(){sample(0,'🥷','#ff6b00','#ff3d1f');sample(1,'🤖','#22d3ee','#3b6cff');check()});
  check();

  /* ---------------- fight engine ---------------- */
  var cv=$('cv'),c=cv.getContext('2d'),SC=cv.width/AW;
  var G={state:'idle',fs:[],proj:[],flames:[],nades:[],meteors:[],zones:[],minions:[],zaps:[],slashes:[],booms:[],parts:[],texts:[],
         shake:0,t:0,overT:0,winner:null,ts:1,hitstop:0,flash:0,kill:null,clock:0,cam:{z:1,fx:AW/2,fy:AH/2}};
  var last=performance.now();

  function buildPowers(i){
    var f=fighters[i];
    if(MODE==='presets')return f.powers.slice();
    var b=f.build;
    if(b.hands==='two')return [b.two];
    var p=[b.rh];if(b.lh&&b.lh!=='none')p.push(b.lh);
    return p;
  }
  function start(){
    G.fs=fighters.map(function(f,i){
      var powers=buildPowers(i),rs=powers.filter(function(k){return POW[k].range});
      var range=MODE==='custom'?(rs.length?POW[rs[0]].range:200):rs.reduce(function(s,k){return s+POW[k].range},0)/Math.max(1,rs.length);
      return{name:f.name,sprite:f.sprite,powers:powers,col:COLS[i],range:range,
        x:i?AW-170:170,y:(TOP+AH)/2,vx:0,vy:0,kx:0,ky:0,hp:HP,cd:{},dashT:0,dashCd:0,strafe:1,strafeT:1,flash:0,
        stun:0,stunImm:0,slowT:0,burnT:0,burnD:0,bleedT:0,bleedD:0,ward:0,healT:0,healPS:0,
        spearHave:true,spearBack:0,throwCd:0,fxT:0};
    });
    G.proj=[];G.flames=[];G.nades=[];G.meteors=[];G.zones=[];G.minions=[];G.zaps=[];G.slashes=[];G.booms=[];G.parts=[];G.texts=[];
    G.shake=0;G.t=0;G.overT=0;G.winner=null;G.ts=1;G.hitstop=0;G.flash=0;G.kill=null;G.clock=0;G.cam={z:1,fx:AW/2,fy:AH/2};
    G.state='count';
    $('over').hidden=true;
  }
  $('go').addEventListener('click',function(){$('arena').hidden=false;start();$('arena').scrollIntoView({behavior:'smooth',block:'center'})});
  $('again').addEventListener('click',start);
  $('change').addEventListener('click',function(){G.state='idle';$('arena').hidden=true;window.scrollTo({top:0,behavior:'smooth'})});

  function other(f){return G.fs[0]===f?G.fs[1]:G.fs[0]}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

  function stunIt(t,secs){if(t.stun>0||t.stunImm>0||t.hp<=0)return false;t.stun=secs;return true}
  function spark(x,y,col,n,sp){
    for(var i=0;i<n;i++){var a=Math.random()*6.283,s=(sp||200)*(.3+Math.random());G.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.2,max:.5,col:col})}
  }
  function text(x,y,txt,col){G.texts.push({x:x,y:y,txt:txt,life:.8,col:col||'#fff'})}

  /* damage. dot = damage over time (no knockback, no numbers) */
  function hurt(t,dmg,sx,sy,kb,dot){
    if(t.hp<=0||G.state!=='fight')return;
    var crit=false;
    if(!dot&&dmg>=3&&Math.random()<.1){crit=true;dmg*=2}
    if(t.ward>0){dmg*=.25;kb*=.3;if(!dot)text(t.x,t.y-R,'WARD','#8fd8ff')}
    t.hp=Math.max(0,t.hp-dmg);
    if(!dot){
      t.flash=.14;
      var a=Math.atan2(t.y-sy,t.x-sx);t.kx+=Math.cos(a)*kb;t.ky+=Math.sin(a)*kb;
      G.shake=Math.min(14,G.shake+dmg*.5);
      if(dmg>=3)text(t.x,t.y-R,(crit?'CRIT ':'')+Math.round(dmg),crit?'#ffd23f':'#fff');
      spark(t.x,t.y,t.col,5,200);
    }
    if(t.hp<=0)finish(t);
  }
  /* the killing blow: freeze for a beat, then slow-mo with the camera punching in */
  function finish(t){
    G.state='over';G.overT=0;G.winner=other(t);G.hitstop=.16;G.flash=.9;G.kill={x:t.x,y:t.y};
    G.shake=Math.max(G.shake,18);
    spark(t.x,t.y,t.col,26,360);spark(t.x,t.y,'#ffffff',12,300);
    G.booms.push({x:t.x,y:t.y,life:.6,max:.6,size:70});
  }
  function explode(x,y,own){
    G.booms.push({x:x,y:y,life:.5,max:.5,size:95});G.shake=Math.min(16,G.shake+10);
    G.fs.forEach(function(f){
      if(f===own)return;
      var d=Math.hypot(f.x-x,f.y-y);
      if(d<95+R)hurt(f,15*(1-.4*d/(95+R)),x,y,520);
    });
  }
  function shoot(f,ang,o){
    G.proj.push({x:f.x+Math.cos(ang)*R,y:f.y+Math.sin(ang)*R,vx:Math.cos(ang)*o.sp,vy:Math.sin(ang)*o.sp,own:f,life:o.life||1.4,
      dmg:o.dmg,kb:o.kb||90,r:o.r||4,kind:o.kind,burn:o.burn,slow:o.slow,stun:o.stun});
  }
  function lead(f,e,sp){
    var d=Math.hypot(e.x-f.x,e.y-f.y),t=d/sp*.7;
    return Math.atan2(e.y+e.vy*t-f.y,e.x+e.vx*t-f.x);
  }
  function melee(f,e,d,ux,uy,key,o){
    if(d<R*2+(o.reach||34)){
      hurt(e,o.dmg,f.x,f.y,o.kb);
      if(o.stun)stunIt(e,o.stun);
      if(o.bleed){e.bleedT=o.bleed[0];e.bleedD=o.bleed[1]}
      if(o.slam){G.booms.push({x:e.x,y:e.y,life:.45,max:.45,size:80});G.shake=Math.min(16,G.shake+6)}
      G.slashes.push({x:(f.x+e.x)/2,y:(f.y+e.y)/2,a:Math.atan2(uy,ux),life:.28,col:f.col,w:o.arc||62});
      f.cd[key]=o.cd;
    }else if(o.dash&&d<o.dash&&f.dashCd<=0){
      f.dashT=.2;f.vx=ux*850;f.vy=uy*850;f.dashCd=o.dashCd||1.5;f.cd[key]=.05;
    }
  }

  var ATK={
    // ---- presets ----
    katana:function(f,e,d,ux,uy){melee(f,e,d,ux,uy,'katana',{dmg:13,kb:430,cd:.85,dash:430})},
    gun:function(f,e,d,ux,uy){
      if(d>460)return;
      shoot(f,Math.atan2(uy,ux)+(Math.random()-.5)*.14,{sp:680,dmg:4,kind:'bullet',life:1.3});
      f.cd.gun=POW.gun.cd;
    },
    bomb:function(f,e,d){
      if(d>450)return;
      G.nades.push({sx:f.x,sy:f.y,tx:clamp(e.x+e.vx*.5,R,AW-R),ty:clamp(e.y+e.vy*.5,TOP,AH-R),t:0,own:f});
      f.cd.bomb=POW.bomb.cd;
    },
    bolt:function(f,e,d){
      if(d>450)return;
      G.zaps.push({x1:f.x,y1:f.y,x2:e.x,y2:e.y,life:.22});
      hurt(e,9,f.x,f.y,170);f.cd.bolt=POW.bolt.cd;
    },
    fire:function(f,e,d,ux,uy){
      if(d>230)return;
      var a=Math.atan2(uy,ux)+(Math.random()-.5)*.5;
      G.flames.push({x:f.x+Math.cos(a)*R,y:f.y+Math.sin(a)*R,vx:Math.cos(a)*400,vy:Math.sin(a)*400,life:.4,own:f,r:8});
      f.cd.fire=POW.fire.cd;
    },
    // ---- right hand ----
    sword:function(f,e,d,ux,uy){melee(f,e,d,ux,uy,'sword',{dmg:8,kb:260,cd:.5,dash:320,dashCd:1.8})},
    waraxe:function(f,e,d,ux,uy){melee(f,e,d,ux,uy,'waraxe',{dmg:15,kb:400,cd:1.05,reach:44})},
    mace:function(f,e,d,ux,uy){melee(f,e,d,ux,uy,'mace',{dmg:10,kb:330,cd:.95,stun:.4})},
    dagger:function(f,e,d,ux,uy){melee(f,e,d,ux,uy,'dagger',{dmg:4.5,kb:140,cd:.27,dash:260,dashCd:1.2})},
    // ---- left hand: spells ----
    fireball:function(f,e,d){
      if(d>400)return;
      shoot(f,lead(f,e,330),{sp:330,dmg:11,kb:200,r:12,kind:'fireball',burn:[3,2.2],life:1.8});
      f.cd.fireball=POW.fireball.cd;
    },
    frost:function(f,e,d){
      if(d>380)return;
      shoot(f,lead(f,e,520),{sp:520,dmg:5,kb:120,r:8,kind:'frost',slow:1.3,life:1.4});
      f.cd.frost=POW.frost.cd;
    },
    shock:function(f,e,d){
      if(d>380)return;
      G.zaps.push({x1:f.x,y1:f.y,x2:e.x,y2:e.y,life:.22});
      hurt(e,6.5,f.x,f.y,150);
      if(Math.random()<.3&&stunIt(e,.45))text(e.x,e.y-R-18,'STUN','#ffe066');
      f.cd.shock=POW.shock.cd;
    },
    heal:function(f){
      if(f.hp>HP*.7||f.healT>0)return;
      f.healT=1.4;f.healPS=24;f.cd.heal=POW.heal.cd;
      text(f.x,f.y-R,'HEAL','#6dff9a');
    },
    ward:function(f,e,d){
      if(d>260||f.ward>0)return;
      f.ward=2.6;f.cd.ward=POW.ward.cd;
      G.booms.push({x:f.x,y:f.y,life:.35,max:.35,size:55,col:'blue'});
    },
    summon:function(f,e,d){
      if(d>480)return;
      var n=G.minions.filter(function(m){return m.own===f}).length;
      if(n>=2)return;
      for(var i=0;i<2;i++)G.minions.push({x:f.x+(i?-1:1)*30,y:f.y+20,vx:0,vy:0,own:f,life:7,hit:0});
      f.cd.summon=POW.summon.cd;
      text(f.x,f.y-R,'SUMMON!','#9be7ff');
      G.booms.push({x:f.x,y:f.y,life:.4,max:.4,size:55,col:'blue'});
    },
    // ---- two-handed weapons ----
    greataxe:function(f,e,d,ux,uy){melee(f,e,d,ux,uy,'greataxe',{dmg:25,kb:540,cd:1.45,reach:56,bleed:[4,3.6],arc:80})},
    warhammer:function(f,e,d,ux,uy){melee(f,e,d,ux,uy,'warhammer',{dmg:28,kb:620,cd:1.5,reach:50,stun:.6,slam:true})},
    spear:function(f,e,d,ux,uy){
      if(f.spearHave){
        if(d<R*2+78){                                   // thrust
          hurt(e,15,f.x,f.y,260);
          G.slashes.push({kind:'stab',x1:f.x,y1:f.y,x2:e.x,y2:e.y,life:.18,col:f.col});
          f.cd.spear=.65;
        }else if(d>150&&d<400&&f.throwCd<=0){            // throw it; it takes a moment to get another
          shoot(f,lead(f,e,880),{sp:880,dmg:30,kb:420,r:6,kind:'spear',life:1});
          f.spearHave=false;f.spearBack=2.8;f.throwCd=4.2;f.cd.spear=.3;
        }
      }else if(d<R*2+30){                                // bare-handed until the spear is back
        hurt(e,2,f.x,f.y,80);f.cd.spear=.5;
      }
    },
    longbow:function(f,e,d){
      if(d>520)return;
      shoot(f,lead(f,e,820),{sp:820,dmg:9.5,kb:160,r:4,kind:'arrow',life:1.2});
      f.cd.longbow=POW.longbow.cd;
    },
    // ---- heavy spells ----
    meteor:function(f,e,d){
      if(d>480)return;
      for(var i=0;i<4;i++)G.meteors.push({tx:clamp(e.x+(Math.random()-.5)*70+e.vx*.7,60,AW-60),ty:clamp(e.y+(Math.random()-.5)*70+e.vy*.7,TOP+30,AH-40),t:-i*.22,dur:.75,own:f});
      f.cd.meteor=POW.meteor.cd;
    },
    blizzard:function(f,e,d){
      if(d>450)return;
      G.zones.push({kind:'ice',x:e.x,y:e.y,r:120,t:0,dur:5,own:f,tick:0});
      f.cd.blizzard=POW.blizzard.cd;
    },
    blackhole:function(f,e,d){
      if(d>430)return;
      G.zones.push({kind:'hole',x:e.x,y:e.y,r:110,t:0,dur:2.6,own:f,tick:0});
      f.cd.blackhole=POW.blackhole.cd;
    }
  };

  function tickStatus(f,dt){
    if(f.stun>0){f.stun-=dt;if(f.stun<=0)f.stunImm=1.2}else if(f.stunImm>0)f.stunImm-=dt;
    if(f.slowT>0)f.slowT-=dt;
    if(f.ward>0)f.ward-=dt;
    if(f.throwCd>0)f.throwCd-=dt;
    if(!f.spearHave){f.spearBack-=dt;if(f.spearBack<=0)f.spearHave=true}
    if(f.burnT>0){
      f.burnT-=dt;hurt(f,f.burnD*dt,0,0,0,true);
      if(Math.random()<dt*14)G.parts.push({x:f.x+(Math.random()-.5)*R,y:f.y+(Math.random()-.5)*R,vx:(Math.random()-.5)*30,vy:-60-Math.random()*40,life:.4,max:.4,col:'#ff9a2a'});
    }
    if(f.bleedT>0){
      f.bleedT-=dt;hurt(f,f.bleedD*dt,0,0,0,true);
      if(Math.random()<dt*10)G.parts.push({x:f.x+(Math.random()-.5)*R,y:f.y+(Math.random()-.5)*R,vx:(Math.random()-.5)*40,vy:40+Math.random()*40,life:.4,max:.4,col:'#d01030'});
    }
    if(f.healT>0){
      f.healT-=dt;f.hp=Math.min(HP,f.hp+f.healPS*dt);
      if(Math.random()<dt*14)G.parts.push({x:f.x+(Math.random()-.5)*R,y:f.y+(Math.random()-.5)*R,vx:0,vy:-70,life:.5,max:.5,col:'#6dff9a'});
    }
  }

  function ai(f,e,dt){
    var kd=Math.max(0,1-dt*6);
    if(f.hp<=0){f.x+=f.kx*dt;f.y+=f.ky*dt;f.kx*=kd;f.ky*=kd;f.x=clamp(f.x,R,AW-R);f.y=clamp(f.y,TOP,AH-R);return}
    tickStatus(f,dt);
    if(f.hp<=0)return;
    var dx=e.x-f.x,dy=e.y-f.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,stunned=f.stun>0;
    f.strafeT-=dt;if(f.strafeT<=0){f.strafe=Math.random()<.5?-1:1;f.strafeT=.6+Math.random()*1.1}
    if(f.dashT>0)f.dashT-=dt;
    else if(stunned){var sd=Math.pow(.05,dt);f.vx*=sd;f.vy*=sd}
    else{
      var sp=170*(f.slowT>0?.65:1),tx=0,ty=0;
      if(d>f.range+30){tx=ux*sp;ty=uy*sp}else if(d<f.range-30){tx=-ux*sp*.9;ty=-uy*sp*.9}
      tx+=-uy*f.strafe*sp*.75;ty+=ux*f.strafe*sp*.75;
      var k=Math.min(1,dt*5);f.vx+=(tx-f.vx)*k;f.vy+=(ty-f.vy)*k;
    }
    f.x+=(f.vx+f.kx)*dt;f.y+=(f.vy+f.ky)*dt;f.kx*=kd;f.ky*=kd;
    if(f.x<R){f.x=R;f.vx=Math.abs(f.vx)}if(f.x>AW-R){f.x=AW-R;f.vx=-Math.abs(f.vx)}
    if(f.y<TOP){f.y=TOP;f.vy=Math.abs(f.vy)}if(f.y>AH-R){f.y=AH-R;f.vy=-Math.abs(f.vy)}
    f.dashCd-=dt;f.flash=Math.max(0,f.flash-dt);
    if(G.state!=='fight'||stunned)return;
    var cdt=dt*(f.slowT>0?.85:1);
    f.powers.forEach(function(p){
      f.cd[p]=(f.cd[p]||0)-cdt;
      if(f.cd[p]<=0)ATK[p](f,e,d,ux,uy);
    });
  }

  function onHit(p,e){
    hurt(e,p.dmg,p.x-p.vx*.01,p.y-p.vy*.01,p.kb);
    if(p.burn){e.burnT=Math.max(e.burnT,p.burn[0]);e.burnD=p.burn[1]}
    if(p.slow)e.slowT=Math.max(e.slowT,p.slow);
    if(p.stun)stunIt(e,p.stun);
    if(p.kind==='fireball')G.booms.push({x:p.x,y:p.y,life:.4,max:.4,size:60});
    if(p.kind==='frost')spark(p.x,p.y,'#bdf1ff',10,220);
  }

  /* is something lethal about to land? (used to slow down and push in before the final hit) */
  function lethalNear(){
    var hit=null;
    G.proj.forEach(function(p){
      var e=other(p.own);
      if(e.hp>0&&e.hp<=p.dmg&&Math.hypot(p.x-e.x,p.y-e.y)<260&&((e.x-p.x)*p.vx+(e.y-p.y)*p.vy)>0)hit=e;
    });
    G.nades.forEach(function(n){var e=other(n.own);if(e.hp>0&&e.hp<=14&&n.t>.35&&Math.hypot(n.tx-e.x,n.ty-e.y)<95+R)hit=e});
    G.meteors.forEach(function(m){var e=other(m.own);if(e.hp>0&&e.hp<=26&&m.t>m.dur-.45&&Math.hypot(m.tx-e.x,m.ty-e.y)<75+R)hit=e});
    return hit;
  }

  function update(rdt){
    if(G.state==='count'){G.t+=rdt;if(G.t>=2.5){G.state='fight';G.t=0}return}

    // time scale and camera
    var near=G.state==='fight'?lethalNear():null,tsT=G.state==='over'?.2:(near?.3:1);
    if(G.hitstop>0){G.hitstop-=rdt;tsT=.02}
    G.ts+=(tsT-G.ts)*Math.min(1,rdt*(tsT<G.ts?14:6));
    var dt=rdt*G.ts,cam=G.cam,zt=1,fx=AW/2,fy=AH/2;
    if(G.state==='over'&&G.kill){zt=2.6;fx=G.kill.x;fy=G.kill.y}
    else if(near){zt=1.7;fx=near.x;fy=near.y}
    cam.z+=(zt-cam.z)*Math.min(1,rdt*(zt>cam.z?6:3));
    cam.fx+=(fx-cam.fx)*Math.min(1,rdt*6);cam.fy+=(fy-cam.fy)*Math.min(1,rdt*6);
    G.flash=Math.max(0,G.flash-rdt*1.6);
    if(G.state==='over'){
      G.overT+=rdt;
      if(G.overT>2.4&&$('over').hidden){$('wname').textContent=G.winner.name+' wins!';$('over').hidden=false}
    }
    G.clock+=dt;

    var a=G.fs[0],b=G.fs[1];
    ai(a,b,dt);ai(b,a,dt);
    var dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;    // keep fighters from overlapping
    if(d<R*2){var push=(R*2-d)/2;a.x-=dx/d*push;a.y-=dy/d*push;b.x+=dx/d*push;b.y+=dy/d*push}
    G.shake*=Math.pow(.02,rdt);

    G.proj=G.proj.filter(function(p){
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
      if(p.life<=0||p.x<-20||p.x>AW+20||p.y<TOP-40||p.y>AH+20)return false;
      var e=other(p.own);
      if(e.hp>0&&Math.hypot(e.x-p.x,e.y-p.y)<R+p.r){onHit(p,e);return false}
      return true;
    });
    G.nades=G.nades.filter(function(n){n.t+=dt;if(n.t>=.75){explode(n.tx,n.ty,n.own);return false}return true});
    G.meteors=G.meteors.filter(function(m){
      m.t+=dt;
      if(m.t<m.dur)return true;
      G.booms.push({x:m.tx,y:m.ty,life:.55,max:.55,size:75});G.shake=Math.min(18,G.shake+8);
      var e=other(m.own);
      if(e.hp>0&&Math.hypot(e.x-m.tx,e.y-m.ty)<75+R){hurt(e,26,m.tx,m.ty,520);e.burnT=Math.max(e.burnT,2.5);e.burnD=2.6}
      return false;
    });
    G.zones=G.zones.filter(function(z){
      z.t+=dt;
      var e=other(z.own),zx=z.x-e.x,zy=z.y-e.y,zd=Math.hypot(zx,zy)||1;
      if(z.t>=z.dur){
        if(z.kind==='hole'&&zd<z.r+R&&e.hp>0){                 // the black hole collapses
          G.booms.push({x:z.x,y:z.y,life:.5,max:.5,size:90,col:'blue'});G.shake=Math.min(18,G.shake+9);
          hurt(e,14,z.x,z.y,420);stunIt(e,.5);
        }
        return false;
      }
      z.tick-=dt;
      if(z.kind==='ice'){
        if(zd>6){z.x-=zx/zd*70*dt;z.y-=zy/zd*70*dt}              // the storm drifts after its target
        if(z.tick<=0){z.tick=.2;if(zd<z.r+R*.6){hurt(e,4.2,z.x,z.y,0,true);e.slowT=Math.max(e.slowT,.5)}}
      }else{
        if(zd<z.r*2.2&&e.hp>0){e.kx+=zx/zd*2600*dt;e.ky+=zy/zd*2600*dt}
        if(z.tick<=0){z.tick=.2;if(zd<z.r+R*.4)hurt(e,3.6,z.x,z.y,0,true)}
      }
      return true;
    });
    G.minions=G.minions.filter(function(m){
      m.life-=dt;if(m.life<=0)return false;
      var e=other(m.own),mx=e.x-m.x,my=e.y-m.y,md=Math.hypot(mx,my)||1,wob=Math.sin(G.clock*5+m.life*3)*90,k=Math.min(1,dt*3);
      m.vx+=(mx/md*260-my/md*wob-m.vx)*k;m.vy+=(my/md*260+mx/md*wob-m.vy)*k;
      m.x+=m.vx*dt;m.y+=m.vy*dt;m.hit-=dt;
      if(md<R+16&&m.hit<=0&&e.hp>0){hurt(e,2.8,m.x,m.y,140);m.hit=.55}
      return true;
    });
    G.flames=G.flames.filter(function(fl){
      fl.x+=fl.vx*dt;fl.y+=fl.vy*dt;fl.life-=dt;fl.r+=dt*60;
      if(fl.life<=0)return false;
      var e=other(fl.own);
      if(Math.hypot(e.x-fl.x,e.y-fl.y)<R+fl.r){hurt(e,1.1,fl.own.x,fl.own.y,20);return false}
      return true;
    });
    [G.zaps,G.slashes,G.booms,G.texts].forEach(function(arr){for(var i=arr.length-1;i>=0;i--){arr[i].life-=dt;if(arr[i].life<=0)arr.splice(i,1)}});
    G.texts.forEach(function(t){t.y-=40*dt});
    G.parts=G.parts.filter(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;return p.life>0});
  }

  /* ---------------- drawing ---------------- */
  function bg(){
    c.fillStyle='#0c0705';c.fillRect(0,0,AW,AH);
    c.strokeStyle='rgba(255,170,100,.06)';c.lineWidth=1;c.beginPath();
    for(var x=0;x<=AW;x+=60){c.moveTo(x,0);c.lineTo(x,AH)}
    for(var y=0;y<=AH;y+=60){c.moveTo(0,y);c.lineTo(AW,y)}
    c.stroke();
    var g=c.createRadialGradient(AW/2,AH/2,120,AW/2,AH/2,620);g.addColorStop(0,'rgba(255,100,20,.08)');g.addColorStop(1,'rgba(0,0,0,.55)');
    c.fillStyle=g;c.fillRect(0,0,AW,AH);
    c.strokeStyle='rgba(255,150,60,.35)';c.lineWidth=2;c.strokeRect(1,TOP-40,AW-2,AH-TOP+39);
  }
  function jag(x1,y1,x2,y2){
    c.beginPath();c.moveTo(x1,y1);
    var n=8,len=Math.hypot(x2-x1,y2-y1)||1,nx=-(y2-y1)/len,ny=(x2-x1)/len;
    for(var i=1;i<n;i++){var t=i/n,o=(Math.random()-.5)*34;c.lineTo(x1+(x2-x1)*t+nx*o,y1+(y2-y1)*t+ny*o)}
    c.lineTo(x2,y2);
  }
  function hud(){
    G.fs.forEach(function(f,i){
      var bw=380,x=i?AW-20-bw:20,y=26,pct=f.hp/HP;
      c.fillStyle='rgba(255,255,255,.12)';c.fillRect(x,y,bw,16);
      c.fillStyle=f.col;
      if(i)c.fillRect(x+bw*(1-pct),y,bw*pct,16);else c.fillRect(x,y,bw*pct,16);
      c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1;c.strokeRect(x,y,bw,16);
      c.fillStyle='#fff4e8';c.font='700 15px "Space Grotesk",system-ui,sans-serif';c.textBaseline='alphabetic';
      c.textAlign=i?'right':'left';c.fillText(f.name,i?x+bw:x,y-6);
      c.font='15px serif';c.textAlign=i?'left':'right';
      c.fillText(f.powers.map(function(k){return POW[k].icon}).join(' '),i?x:x+bw,y-6);
      var st=(f.burnT>0?'🔥':'')+(f.slowT>0?'❄️':'')+(f.bleedT>0?'🩸':'')+(f.ward>0?'🛡️':'')+(f.stun>0?'💫':'');
      if(st){c.textAlign=i?'right':'left';c.fillText(st,i?x+bw:x,y+36)}
    });
  }
  function drawProj(p){
    var ang=Math.atan2(p.vy,p.vx);
    if(p.kind==='bullet'){
      c.strokeStyle='rgba(255,220,120,.6)';c.lineWidth=3;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);c.stroke();
      c.fillStyle='#fff';c.beginPath();c.arc(p.x,p.y,4,0,6.2832);c.fill();
    }else if(p.kind==='arrow'||p.kind==='spear'){
      var len=p.kind==='spear'?46:30;
      c.strokeStyle=p.kind==='spear'?'#e8d9b0':'#d8c7a0';c.lineWidth=p.kind==='spear'?4:2.4;c.lineCap='round';
      c.beginPath();c.moveTo(p.x-Math.cos(ang)*len,p.y-Math.sin(ang)*len);c.lineTo(p.x,p.y);c.stroke();
      c.fillStyle='#fff';c.beginPath();c.arc(p.x,p.y,3,0,6.2832);c.fill();
    }else if(p.kind==='fireball'){
      c.globalCompositeOperation='lighter';
      var g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,24);g.addColorStop(0,'rgba(255,240,170,1)');g.addColorStop(.4,'rgba(255,120,20,.8)');g.addColorStop(1,'rgba(255,40,0,0)');
      c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,24,0,6.2832);c.fill();
      c.strokeStyle='rgba(255,140,30,.5)';c.lineWidth=8;c.lineCap='round';c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.06,p.y-p.vy*.06);c.stroke();
      c.globalCompositeOperation='source-over';
    }else{                                               // frost shard
      c.save();c.translate(p.x,p.y);c.rotate(ang);
      c.fillStyle='#cfefff';c.shadowColor='#6fd2ff';c.shadowBlur=14;
      c.beginPath();c.moveTo(16,0);c.lineTo(-8,6);c.lineTo(-4,0);c.lineTo(-8,-6);c.closePath();c.fill();c.restore();
    }
  }
  function draw(){
    c.setTransform(SC,0,0,SC,0,0);
    c.fillStyle='#000';c.fillRect(0,0,AW,AH);
    var cam=G.cam,z=cam.z,fx=clamp(cam.fx,AW/(2*z),AW-AW/(2*z)),fy=clamp(cam.fy,AH/(2*z),AH-AH/(2*z));
    c.save();
    c.translate(AW/2,AH/2);c.scale(z,z);c.translate(-fx,-fy);
    c.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
    bg();

    G.zones.forEach(function(zn){
      var k=zn.t/zn.dur,a=Math.min(1,(1-k)*3);
      if(zn.kind==='ice'){
        c.fillStyle='rgba(150,220,255,'+.14*a+')';c.beginPath();c.arc(zn.x,zn.y,zn.r,0,6.2832);c.fill();
        c.strokeStyle='rgba(200,240,255,'+.5*a+')';c.lineWidth=2;c.setLineDash([8,6]);c.beginPath();c.arc(zn.x,zn.y,zn.r,0,6.2832);c.stroke();c.setLineDash([]);
        c.fillStyle='rgba(255,255,255,'+.8*a+')';
        for(var s=0;s<16;s++){var sa=Math.random()*6.2832,sr=Math.random()*zn.r;c.fillRect(zn.x+Math.cos(sa)*sr,zn.y+Math.sin(sa)*sr,2,2)}
      }else{
        var rr=zn.r*Math.min(1,zn.t*3)*(1-Math.max(0,k-.8)*5),g=c.createRadialGradient(zn.x,zn.y,0,zn.x,zn.y,rr||1);
        g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.6,'rgba(30,0,60,.9)');g.addColorStop(1,'rgba(150,60,255,0)');
        c.fillStyle=g;c.beginPath();c.arc(zn.x,zn.y,rr,0,6.2832);c.fill();
        c.strokeStyle='rgba(190,120,255,.7)';c.lineWidth=2;
        for(var q=0;q<3;q++){c.beginPath();c.arc(zn.x,zn.y,rr*.9,G.clock*4+q*2.1,G.clock*4+q*2.1+1.2);c.stroke()}
      }
    });
    G.meteors.forEach(function(m){
      if(m.t<0)return;
      var u=m.t/m.dur,pulse=.5+.5*Math.sin(m.t*18);
      c.strokeStyle='rgba(255,80,40,'+(.4+.4*pulse)+')';c.lineWidth=2;c.beginPath();c.arc(m.tx,m.ty,75,0,6.2832);c.stroke();
      c.fillStyle='rgba(255,60,20,'+.08*u+')';c.beginPath();c.arc(m.tx,m.ty,75*u,0,6.2832);c.fill();
      var mx=m.tx+(1-u)*220,my=m.ty-(1-u)*520;
      c.globalCompositeOperation='lighter';
      c.strokeStyle='rgba(255,140,30,.6)';c.lineWidth=10;c.lineCap='round';c.beginPath();c.moveTo(mx,my);c.lineTo(mx+60,my-140);c.stroke();
      var g=c.createRadialGradient(mx,my,0,mx,my,28);g.addColorStop(0,'rgba(255,245,200,1)');g.addColorStop(.5,'rgba(255,110,20,.9)');g.addColorStop(1,'rgba(255,40,0,0)');
      c.fillStyle=g;c.beginPath();c.arc(mx,my,28,0,6.2832);c.fill();
      c.globalCompositeOperation='source-over';
    });

    G.fs.forEach(function(f){
      c.globalAlpha=f.hp<=0?.4:1;
      c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(f.x,f.y+R-4,R*.9,R*.28,0,0,6.2832);c.fill();
      c.drawImage(f.sprite,f.x-R,f.y-R,R*2,R*2);
      c.strokeStyle=f.col;c.lineWidth=4;c.beginPath();c.arc(f.x,f.y,R,0,6.2832);c.stroke();
      if(f.slowT>0){c.fillStyle='rgba(150,220,255,.25)';c.beginPath();c.arc(f.x,f.y,R,0,6.2832);c.fill()}
      if(f.flash>0){c.fillStyle='rgba(255,255,255,'+(f.flash/.14*.6)+')';c.beginPath();c.arc(f.x,f.y,R,0,6.2832);c.fill()}
      if(f.ward>0){
        c.strokeStyle='rgba(140,220,255,'+(.5+.3*Math.sin(G.clock*10))+')';c.lineWidth=3;c.beginPath();c.arc(f.x,f.y,R+8,0,6.2832);c.stroke();
        c.fillStyle='rgba(140,220,255,.12)';c.fill();
      }
      if(f.stun>0){c.font='20px serif';c.textAlign='center';c.fillText('💫',f.x,f.y-R-6)}
      c.globalAlpha=1;
    });

    G.minions.forEach(function(m){
      c.globalAlpha=Math.min(1,m.life*2)*.9;
      c.fillStyle='rgba(120,220,255,.25)';c.beginPath();c.arc(m.x,m.y,17,0,6.2832);c.fill();
      c.strokeStyle=m.own.col;c.lineWidth=2;c.stroke();
      c.font='22px serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.fillText('🐺',m.x,m.y+1);c.textBaseline='alphabetic';
      c.globalAlpha=1;
    });

    c.globalCompositeOperation='lighter';
    G.flames.forEach(function(fl){
      var a=Math.max(0,fl.life/.4),g=c.createRadialGradient(fl.x,fl.y,0,fl.x,fl.y,fl.r);
      g.addColorStop(0,'rgba(255,230,120,'+a+')');g.addColorStop(.5,'rgba(255,110,20,'+a*.7+')');g.addColorStop(1,'rgba(255,40,0,0)');
      c.fillStyle=g;c.beginPath();c.arc(fl.x,fl.y,fl.r,0,6.2832);c.fill();
    });
    G.booms.forEach(function(b){
      var k=1-b.life/b.max,r=20+(b.size||95)*Math.sqrt(k),g=c.createRadialGradient(b.x,b.y,0,b.x,b.y,r),
          pal=b.col==='blue'?['rgba(200,245,255,','rgba(60,170,255,','rgba(20,80,255,']:['rgba(255,240,180,','rgba(255,120,20,','rgba(255,40,0,'];
      g.addColorStop(0,pal[0]+(1-k)+')');g.addColorStop(.6,pal[1]+(.8*(1-k))+')');g.addColorStop(1,pal[2]+'0)');
      c.fillStyle=g;c.beginPath();c.arc(b.x,b.y,r,0,6.2832);c.fill();
    });
    c.globalCompositeOperation='source-over';

    G.proj.forEach(drawProj);
    G.nades.forEach(function(n){
      var u=n.t/.75,x=n.sx+(n.tx-n.sx)*u,y=n.sy+(n.ty-n.sy)*u,zz=Math.sin(Math.PI*u)*90;
      c.strokeStyle='rgba(255,100,40,.45)';c.lineWidth=1.5;c.setLineDash([5,5]);c.beginPath();c.arc(n.tx,n.ty,95,0,6.2832);c.stroke();c.setLineDash([]);
      c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(x,y,8,4,0,0,6.2832);c.fill();
      c.fillStyle=(Math.floor(n.t*14)%2)?'#ff3d1f':'#2a1a14';c.beginPath();c.arc(x,y-zz,8,0,6.2832);c.fill();
    });
    G.zaps.forEach(function(zp){
      var a=zp.life/.22;c.lineJoin='round';
      jag(zp.x1,zp.y1,zp.x2,zp.y2);c.strokeStyle='rgba(255,170,60,'+a*.4+')';c.lineWidth=9;c.stroke();
      jag(zp.x1,zp.y1,zp.x2,zp.y2);c.strokeStyle='rgba(255,255,255,'+a+')';c.lineWidth=2.5;c.stroke();
    });
    G.slashes.forEach(function(s){
      if(s.kind==='stab'){
        var sa=s.life/.18;c.strokeStyle='rgba(255,255,255,'+sa+')';c.lineWidth=5*sa;c.lineCap='round';c.shadowColor=s.col;c.shadowBlur=14;
        c.beginPath();c.moveTo(s.x1,s.y1);c.lineTo(s.x2,s.y2);c.stroke();c.shadowBlur=0;return;
      }
      var a=s.life/.28;c.strokeStyle='rgba(255,255,255,'+a+')';c.lineWidth=9*a;c.lineCap='round';
      c.shadowColor=s.col;c.shadowBlur=16;
      c.beginPath();c.arc(s.x,s.y,s.w||62,s.a-1.1,s.a+1.1);c.stroke();c.shadowBlur=0;
    });
    G.parts.forEach(function(p){c.fillStyle=p.col;c.globalAlpha=Math.max(0,p.life/(p.max||.4));c.fillRect(p.x,p.y,3,3)});c.globalAlpha=1;
    c.font='700 20px "Space Grotesk",system-ui,sans-serif';c.textAlign='center';
    G.texts.forEach(function(t){c.globalAlpha=Math.min(1,t.life*2);c.fillStyle=t.col;c.fillText(t.txt,t.x,t.y)});c.globalAlpha=1;
    c.restore();

    // killcam dressing: dark edges, speed lines, flash and K.O.
    if(z>1.05){
      var vg=c.createRadialGradient(AW/2,AH/2,AH*.25,AW/2,AH/2,AH*.85);
      vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,'+Math.min(.75,(z-1)*.45)+')');
      c.fillStyle=vg;c.fillRect(0,0,AW,AH);
    }
    if(G.state==='over'&&G.overT<.7){
      c.strokeStyle='rgba(255,255,255,'+(.5*(1-G.overT/.7))+')';c.lineWidth=2;c.beginPath();
      for(var l=0;l<28;l++){var la=l/28*6.2832+G.overT*3,r0=AH*.45,r1=AH*.9;c.moveTo(AW/2+Math.cos(la)*r0,AH/2+Math.sin(la)*r0);c.lineTo(AW/2+Math.cos(la)*r1,AH/2+Math.sin(la)*r1)}
      c.stroke();
    }
    if(G.flash>0){c.fillStyle='rgba(255,255,255,'+G.flash*.55+')';c.fillRect(0,0,AW,AH)}
    hud();
    if(G.state==='over'&&G.overT>.2){
      var ka=Math.min(1,(G.overT-.2)*3);
      c.save();c.globalAlpha=ka;c.fillStyle='#fff4e8';c.font='800 '+(110+20*Math.min(1,G.overT)).toFixed(0)+'px "Space Grotesk",system-ui,sans-serif';
      c.textAlign='center';c.textBaseline='middle';c.shadowColor='#ff3d1f';c.shadowBlur=40;c.fillText('K.O.',AW/2,AH/2);c.restore();
    }
    if(G.state==='count'){
      var n=3-Math.floor(G.t/.7),txt=G.t<2.1?String(Math.max(1,n)):'FIGHT!';
      c.fillStyle='#fff4e8';c.font='800 120px "Space Grotesk",system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';
      c.shadowColor='#ff6b00';c.shadowBlur=30;c.fillText(txt,AW/2,AH/2+20);c.shadowBlur=0;c.textBaseline='alphabetic';
    }
  }

  function loop(now){
    var dt=Math.min(.033,(now-last)/1000);last=now;
    if(G.state!=='idle'){update(dt);draw()}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
