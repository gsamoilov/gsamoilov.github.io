<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient Labs | Greg</title>
<link rel="icon" type="image/png" href="/images/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff4e8;--muted:#b9a08c;--yellow:#ffb703;--orange:#ff6b00;--red:#ff3d1f;
  --g-bg:rgba(255,100,20,.07);--g-bd:rgba(255,150,60,.35);--g-sh:0 0 40px rgba(255,80,0,.14),inset 0 1px 0 rgba(255,220,180,.16);
  --font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;color:var(--ink);font-family:var(--font);line-height:1.5;overflow-x:hidden;background:#0c0705}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.glow i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.3}
.glow i:nth-child(1){width:46vw;height:46vw;background:var(--red);top:-12vw;left:-10vw}
.glow i:nth-child(2){width:40vw;height:40vw;background:var(--yellow);bottom:-14vw;right:-8vw;opacity:.2}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
.back{position:absolute;top:24px;left:clamp(16px,4vw,36px);color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:90px 20px 60px;text-align:center}
h1{font-size:clamp(2.6rem,9vw,5rem);letter-spacing:-.045em;line-height:1;
  background:linear-gradient(100deg,var(--ink) 10%,var(--yellow) 50%,var(--orange) 75%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:12px auto 34px;max-width:46ch}
.glass{background:var(--g-bg);border:1px solid var(--g-bd);box-shadow:var(--g-sh);backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%)}
.tabs{display:inline-flex;gap:6px;padding:6px;border-radius:99px}
.tabs button{font:inherit;color:var(--ink);background:none;border:0;border-radius:99px;padding:10px 24px;cursor:pointer;transition:background .2s}
.tabs button:hover{background:rgba(255,160,60,.18)}
.tabs button[aria-selected="true"]{background:linear-gradient(100deg,var(--yellow),var(--orange) 60%,var(--red));color:#1a0a04;font-weight:500}
.panel{margin:26px auto 0;max-width:460px;padding:34px 28px;border-radius:24px}
.panel .ic{width:54px;height:54px;margin:0 auto 14px;color:var(--yellow)}
.panel .ic svg{width:100%;height:100%;fill:currentColor}
.panel h2{font-size:1.6rem;letter-spacing:-.03em}
.panel .handle{color:var(--muted);margin:2px 0 22px}
.go{display:inline-block;padding:13px 30px;border-radius:99px;font-weight:500;text-decoration:none;color:#1a0a04;
  background:linear-gradient(100deg,var(--yellow),var(--orange) 55%,var(--red));transition:transform .2s}
.go:hover{transform:scale(1.05)}
.fade{animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:420px){.tabs button{padding:9px 14px}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><i></i><i></i></div>
<a class="back" href="/">Back home</a>
<main>
  <h1>Gradient Labs</h1>
  <p class="sub">Pick a platform to find me there.</p>

  <div class="tabs glass" role="tablist" aria-label="Platform">
    <button role="tab" id="t-tiktok" aria-selected="true" aria-controls="panel">TikTok</button>
    <button role="tab" id="t-youtube" aria-selected="false" aria-controls="panel">YouTube</button>
    <button role="tab" id="t-instagram" aria-selected="false" aria-controls="panel">Instagram</button>
  </div>

  <section class="panel glass" id="panel" role="tabpanel" aria-live="polite">
    <div class="ic" id="ic" aria-hidden="true"></div>
    <h2 id="name"></h2>
    <p class="handle" id="handle"></p>
    <a class="go" id="go" href="#" target="_blank" rel="noopener noreferrer"></a>
  </section>
</main>

<script>
(function(){
  var P={
    tiktok:{name:'TikTok',handle:'@gradientlabs',url:'https://www.tiktok.com/@gradientlabs',
      icon:'<svg viewBox="0 0 24 24"><path d="M16.6 2h-3.2v12.4a2.8 2.8 0 1 1-2.8-2.8c.3 0 .6 0 .8.1V8.4a6 6 0 1 0 5.2 5.9V8.6a7.4 7.4 0 0 0 4.3 1.4V6.8a4.3 4.3 0 0 1-4.3-4.8z"/></svg>'},
    youtube:{name:'YouTube',handle:'@GradientLabss',url:'https://www.youtube.com/@GradientLabss',
      icon:'<svg viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2C.5 9.1.5 12 .5 12s0 2.9.5 4.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-4.8.5-4.8s0-2.9-.5-4.8zM9.8 15.4V8.6l5.9 3.4-5.9 3.4z"/></svg>'},
    instagram:{name:'Instagram',handle:'@gradientlabss',url:'https://www.instagram.com/gradientlabss/',
      icon:'<svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 4 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zM12 0C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12s0 3.7.1 4.9c.2 4.4 2.6 6.8 7 7 1.2.1 1.6.1 4.9.1s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9c-.2-4.4-2.6-6.8-7-7C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.8a1.4 1.4 0 1 0 0 2.9 1.4 1.4 0 0 0 0-2.9z"/></svg>'}
  };
  var keys=Object.keys(P),tabs={},panel=document.getElementById('panel');
  keys.forEach(function(k){
    var b=document.getElementById('t-'+k);tabs[k]=b;
    b.addEventListener('click',function(){pick(k)});
    b.addEventListener('keydown',function(e){
      var i=keys.indexOf(k),n=e.key==='ArrowRight'?i+1:e.key==='ArrowLeft'?i-1:null;
      if(n===null)return;e.preventDefault();n=(n+keys.length)%keys.length;pick(keys[n]);tabs[keys[n]].focus();
    });
  });
  function pick(k){
    var d=P[k];
    keys.forEach(function(x){tabs[x].setAttribute('aria-selected',x===k);tabs[x].tabIndex=x===k?0:-1});
    document.getElementById('ic').innerHTML=d.icon;
    document.getElementById('name').textContent=d.name;
    document.getElementById('handle').textContent=d.handle;
    var g=document.getElementById('go');g.href=d.url;g.textContent='Open on '+d.name+' →';
    panel.setAttribute('aria-labelledby','t-'+k);
    panel.classList.remove('fade');void panel.offsetWidth;panel.classList.add('fade');
    try{history.replaceState(null,'','#'+k)}catch(e){}
  }
  var h=location.hash.slice(1);pick(P[h]?h:'tiktok');
})();
</script>
</body>
</html>
