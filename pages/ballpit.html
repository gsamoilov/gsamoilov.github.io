<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball pit | Greg</title>
<link rel="icon" type="image/png" href="/images/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff4e8;--muted:#b9a08c;--yellow:#ffb703;--orange:#ff6b00;--red:#ff3d1f;
  --g-bg:rgba(255,100,20,.07);--g-bd:rgba(255,150,60,.35);--g-sh:0 0 40px rgba(255,80,0,.14),inset 0 1px 0 rgba(255,220,180,.16);
  --font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{color:var(--ink);font-family:var(--font);line-height:1.4;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse 70% 60% at 50% 100%,rgba(255,90,20,.18),transparent 70%),radial-gradient(ellipse 50% 40% at 15% 0%,rgba(255,61,31,.12),transparent 70%),#0c0705}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
.back{position:fixed;top:18px;left:clamp(14px,3vw,30px);z-index:5;color:var(--muted);text-decoration:none;font-size:.95rem}
.back:hover{color:var(--ink)}
.panel{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:4;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:center;
  width:max-content;max-width:calc(100vw - 24px);padding:10px 16px;border-radius:22px;
  background:var(--g-bg);border:1px solid var(--g-bd);box-shadow:var(--g-sh);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%)}
.grp{display:flex;align-items:center;gap:6px}
.grp>span{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.btn{white-space:nowrap;font:inherit;font-size:.9rem;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--g-bd);border-radius:99px;padding:6px 14px;cursor:pointer;transition:background .2s,transform .1s}
.btn:hover{background:rgba(255,160,60,.2)}
.btn:active{transform:scale(.94)}
.btn[aria-pressed="true"]{background:linear-gradient(100deg,var(--yellow),var(--orange) 60%,var(--red));color:#1a0a04;border-color:transparent;font-weight:500}
#count{text-transform:none;letter-spacing:0;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;min-width:84px;text-align:right}
#hint{position:fixed;left:50%;top:56%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;text-align:center;color:var(--muted);font-size:1.1rem;transition:opacity .6s}
#hint b{display:block;color:var(--ink);font-size:clamp(1.6rem,5vw,2.6rem);letter-spacing:-.03em;margin-bottom:4px}
@media (max-width:640px){.panel{padding:8px 10px;gap:6px 12px;top:46px}.btn{padding:5px 11px;font-size:.84rem}.grp>span{display:none}}
</style>
</head>
<body>
<a class="back" href="/">Back home</a>

<div class="panel glass" role="group" aria-label="Ball pit controls">
  <div class="grp" id="gw"><span>Weight</span>
    <button class="btn" type="button" data-w="light" aria-pressed="false">Light</button>
    <button class="btn" type="button" data-w="medium" aria-pressed="true">Medium</button>
    <button class="btn" type="button" data-w="heavy" aria-pressed="false">Heavy</button>
    <button class="btn" type="button" data-w="mix" aria-pressed="false">Mix</button>
  </div>
  <div class="grp" id="gm"><span>Material</span>
    <button class="btn" type="button" data-m="bouncy" aria-pressed="true">Bouncy</button>
    <button class="btn" type="button" data-m="hard" aria-pressed="false">Hard</button>
    <button class="btn" type="button" data-m="soft" aria-pressed="false">Soft</button>
  </div>
  <div class="grp">
    <button class="btn" type="button" id="rain">Rain</button>
    <button class="btn" type="button" id="shake">Shake</button>
    <button class="btn" type="button" id="flip" aria-pressed="false">Flip gravity</button>
    <button class="btn" type="button" id="clear">Clear</button>
    <button class="btn" type="button" id="snd" aria-pressed="true">Sound</button>
    <span id="count">0 objects</span>
  </div>
</div>

<div id="hint"><b>Fill the pit.</b>Click or hold anywhere to drop things. Drag them to throw.</div>
<canvas id="cv"></canvas>

<script>
(function(){
  var cv=document.getElementById('cv'),c=cv.getContext('2d'),W=0,H=0,D=1,sprites={};
  var MAXB=320,CELL=90,G0=1900,flip=false,balls=[],wSel='medium',mSel='bouncy';

  /* weight classes: size and density decide the mass (about 1 : 7 : 45 from light to heavy) */
  var WT={light:{r:[12,17],d:.4},medium:{r:[21,27],d:1},heavy:{r:[33,40],d:2.4}};
  /* materials: e = bounciness, mu = grip, fix = how firmly overlaps get pushed apart (soft ones squish into each other) */
  var MT={
    bouncy:{e:.9,mu:.15,fix:.85,cols:['#ff3d1f','#ff6b00','#ffb703','#ff8a3d','#ffd166','#ff4d6d']},
    hard:  {e:.36,mu:.3,fix:.9,cols:['#c9ced6','#9aa3b0','#7d8794','#d9b37a','#b87333','#8fb4d9']},
    soft:  {e:.04,mu:.75,fix:.55,cols:['#ffd6c2','#ffc2cc','#ffe3a3','#f2c9ff','#c7f0d8','#ffcba4']}
  };

  function resize(){
    D=devicePixelRatio||1;W=innerWidth;H=innerHeight;
    cv.width=W*D;cv.height=H*D;c.setTransform(D,0,0,D,0,0);sprites={};
    balls.forEach(function(b){b.x=Math.max(b.r,Math.min(W-b.r,b.x));if(b.y>H-b.r)b.y=H-b.r});
  }
  function rnd(a,b){return a+Math.random()*(b-a)}

  /* ---------- sprites (one cached image per material/colour/size, so drawing hundreds of balls stays cheap) ---------- */
  function hex(h){return[parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]}
  function mix(a,b,t){return'rgb('+(a[0]+(b[0]-a[0])*t|0)+','+(a[1]+(b[1]-a[1])*t|0)+','+(a[2]+(b[2]-a[2])*t|0)+')'}
  function sprite(b){
    var key=b.mat+b.ci+'_'+b.r;if(sprites[key])return sprites[key];
    var r=b.r,s=2*r+10,cvs=document.createElement('canvas');cvs.width=cvs.height=Math.ceil(s*D);
    var g=cvs.getContext('2d');g.scale(D,D);g.translate(s/2,s/2);
    var col=hex(MT[b.mat].cols[b.ci]),white=[255,255,255],black=[20,8,4],gr;
    if(b.mat==='bouncy'){
      gr=g.createRadialGradient(-r*.35,-r*.4,r*.05,0,0,r);
      gr.addColorStop(0,mix(col,white,.75));gr.addColorStop(.4,mix(col,white,0));gr.addColorStop(1,mix(col,black,.55));
      g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,6.2832);g.fill();
      g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.ellipse(-r*.36,-r*.42,r*.2,r*.12,-.6,0,6.2832);g.fill();
    }else if(b.mat==='hard'){
      gr=g.createLinearGradient(0,-r,0,r);
      gr.addColorStop(0,mix(col,white,.85));gr.addColorStop(.46,mix(col,white,.15));gr.addColorStop(.5,mix(col,black,.7));
      gr.addColorStop(.58,mix(col,white,.1));gr.addColorStop(1,mix(col,black,.6));
      g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,6.2832);g.fill();
      g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1.2;g.stroke();
      g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.ellipse(-r*.38,-r*.5,r*.16,r*.08,-.7,0,6.2832);g.fill();
    }else{
      gr=g.createRadialGradient(-r*.2,-r*.25,r*.1,0,0,r);
      gr.addColorStop(0,mix(col,white,.35));gr.addColorStop(.7,mix(col,white,0));gr.addColorStop(1,mix(col,black,.22));
      g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,6.2832);g.fill();
    }
    sprites[key]={img:cvs,s:s};return sprites[key];
  }

  /* ---------- sound: tiny synthesized thuds, pitch follows weight ---------- */
  var AC=null,soundOn=true,lastSnd=0;
  function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
  function hit(b,speed){
    if(!soundOn||!AC||speed<170)return;
    var t=performance.now();if(t-lastSnd<32)return;lastSnd=t;
    var vol=Math.min(1,speed/1300)*.22,f=900/Math.pow(b.m/100,.3),o=AC.createOscillator(),gn=AC.createGain(),now=AC.currentTime,dur=.09;
    if(b.mat==='bouncy'){o.type='sine';o.frequency.setValueAtTime(f*1.3,now);o.frequency.exponentialRampToValueAtTime(f*.55,now+.13);dur=.14}
    else if(b.mat==='hard'){o.type='triangle';o.frequency.setValueAtTime(f*1.9,now);o.frequency.exponentialRampToValueAtTime(f*1.2,now+.05);dur=.06;vol*=.8}
    else{o.type='sine';o.frequency.setValueAtTime(f*.45,now);o.frequency.exponentialRampToValueAtTime(f*.25,now+.08);vol*=.9}
    gn.gain.setValueAtTime(vol,now);gn.gain.exponentialRampToValueAtTime(.0001,now+dur);
    o.connect(gn);gn.connect(AC.destination);o.start(now);o.stop(now+dur+.02);
  }

  /* ---------- objects ---------- */
  function spawn(x,y,vx,vy){
    var wk=wSel;if(wk==='mix'){var q=Math.random();wk=q<.4?'light':q<.8?'medium':'heavy'}
    var w=WT[wk],mt=MT[mSel],r=Math.round(rnd(w.r[0],w.r[1])),m=w.d*r*r;
    var b={x:x,y:y,vx:vx||0,vy:vy||0,r:r,m:m,im:1/m,mat:mSel,e:mt.e,mu:mt.mu,fix:mt.fix,ci:Math.floor(Math.random()*mt.cols.length),
           ang:Math.random()*6.28,sq:0,sqa:0,held:false};
    balls.push(b);if(balls.length>MAXB)balls.shift();
    return b;
  }
  function impact(b,speed,nx,ny){
    var k=b.mat==='soft'?1:b.mat==='bouncy'?.55:.18,s=Math.min(1,speed/900)*k;
    if(s>b.sq){b.sq=s;b.sqa=Math.atan2(ny,nx)}
    hit(b,speed);
  }

  /* ---------- physics ---------- */
  var P={x:0,y:0,down:false},grab=null,holdT=0;
  var cols=1,rows=1,grid=[];
  function buildGrid(){
    cols=Math.ceil(W/CELL)+1;rows=Math.ceil(H/CELL)+1;grid.length=cols*rows;
    for(var i=0;i<grid.length;i++)grid[i]=null;
    for(i=0;i<balls.length;i++){
      var b=balls[i],cx=Math.max(0,Math.min(cols-1,b.x/CELL|0)),cy=Math.max(0,Math.min(rows-1,b.y/CELL|0)),k=cy*cols+cx;
      (grid[k]||(grid[k]=[])).push(i);b.cx=cx;b.cy=cy;
    }
  }
  function pairs(){
    var i,j,k,a,b,cx,cy,l,list;
    for(i=0;i<balls.length;i++){
      a=balls[i];
      for(cy=Math.max(0,a.cy-1);cy<=Math.min(rows-1,a.cy+1);cy++)for(cx=Math.max(0,a.cx-1);cx<=Math.min(cols-1,a.cx+1);cx++){
        list=grid[cy*cols+cx];if(!list)continue;
        for(l=0;l<list.length;l++){
          j=list[l];if(j<=i)continue;b=balls[j];
          var dx=b.x-a.x,dy=b.y-a.y,rs=a.r+b.r;
          if(dx>rs||dx<-rs||dy>rs||dy<-rs)continue;
          var d2=dx*dx+dy*dy;if(d2>=rs*rs)continue;
          var d=Math.sqrt(d2)||.001,nx=dx/d,ny=dy/d,ov=rs-d,sum=a.im+b.im,fix=(a.fix+b.fix)/2;
          var ca=ov*fix*a.im/sum,cb=ov*fix*b.im/sum;
          a.x-=nx*ca;a.y-=ny*ca;b.x+=nx*cb;b.y+=ny*cb;
          var rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;
          if(vn<0){
            var e=(a.e+b.e)/2;if(-vn<45)e=0;
            var jn=-(1+e)*vn/sum;
            a.vx-=nx*jn*a.im;a.vy-=ny*jn*a.im;b.vx+=nx*jn*b.im;b.vy+=ny*jn*b.im;
            if(-vn>120){impact(a,-vn,nx,ny);impact(b,-vn,-nx,-ny)}
          }
          /* grip: damp sliding between touching objects */
          rvx=b.vx-a.vx;rvy=b.vy-a.vy;vn=rvx*nx+rvy*ny;
          var tx=rvx-vn*nx,ty=rvy-vn*ny,gf=Math.min(1,(a.mu+b.mu)*4*DT)/sum;
          a.vx+=tx*gf*a.im;a.vy+=ty*gf*a.im;b.vx-=tx*gf*b.im;b.vy-=ty*gf*b.im;
        }
      }
    }
  }
  function walls(){
    for(var i=0;i<balls.length;i++){
      var b=balls[i],r=b.r;
      if(b.x<r){b.x=r;if(b.vx<0){var v=-b.vx;b.vx=v<45?0:v*b.e;if(v>120)impact(b,v,-1,0)}}
      else if(b.x>W-r){b.x=W-r;if(b.vx>0){var v2=b.vx;b.vx=v2<45?0:-v2*b.e;if(v2>120)impact(b,v2,1,0)}}
      if(b.y>H-r){b.y=H-r;if(b.vy>0){var v3=b.vy;b.vy=v3<60?0:-v3*b.e;if(v3>120)impact(b,v3,0,1)}b.vx*=1-Math.min(1,b.mu*3*DT)}
      if(flip&&b.y<r){b.y=r;if(b.vy<0){var v4=-b.vy;b.vy=v4<60?0:v4*b.e;if(v4>120)impact(b,v4,0,-1)}b.vx*=1-Math.min(1,b.mu*3*DT)}
    }
  }
  var DT=1/120;
  function step(dt){
    DT=dt;var G=flip?-G0:G0,i,b;
    for(i=0;i<balls.length;i++){
      b=balls[i];
      if(b===grab){                                   /* held: a springy tether to the pointer */
        var ax=(P.x-b.x)*700-b.vx*52,ay=(P.y-b.y)*700-b.vy*52;
        b.vx+=ax*dt;b.vy+=ay*dt;
      }else b.vy+=G*dt;
      var sp=Math.hypot(b.vx,b.vy);if(sp>3000){b.vx*=3000/sp;b.vy*=3000/sp}
      b.vx*=1-.04*dt;b.vy*=1-.04*dt;
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      b.ang+=b.vx/b.r*dt*.6;
    }
    buildGrid();
    for(var it=0;it<3;it++){pairs();walls()}
  }

  /* ---------- drawing ---------- */
  function draw(){
    c.clearRect(0,0,W,H);
    var i,b,sp;
    for(i=0;i<balls.length;i++){
      b=balls[i];if(b.y<-b.r*2||b.y>H+b.r*2)continue;
      sp=sprite(b);
      c.save();c.translate(b.x,b.y);
      if(b.sq>.01){c.rotate(b.sqa);c.scale(1-b.sq*.3,1+b.sq*.22);c.rotate(-b.sqa)}
      c.drawImage(sp.img,-sp.s/2,-sp.s/2,sp.s,sp.s);
      c.fillStyle='rgba(0,0,0,.16)';c.beginPath();c.arc(Math.cos(b.ang)*b.r*.55,Math.sin(b.ang)*b.r*.55,Math.max(1.6,b.r*.13),0,6.2832);c.fill();
      c.restore();
    }
    var g=c.createLinearGradient(0,H-26,0,H);g.addColorStop(0,'rgba(255,120,40,0)');g.addColorStop(1,'rgba(255,120,40,.22)');
    c.fillStyle=g;c.fillRect(0,H-26,W,26);
  }

  /* ---------- input ---------- */
  function pick(x,y){
    for(var i=balls.length-1;i>=0;i--){var b=balls[i];if(Math.hypot(b.x-x,b.y-y)<=b.r+4)return b}
    return null;
  }
  function pos(e){P.x=e.clientX;P.y=e.clientY}
  cv.addEventListener('pointerdown',function(e){
    audio();pos(e);P.down=true;
    try{cv.setPointerCapture(e.pointerId)}catch(err){}
    var b=pick(P.x,P.y);
    if(b){grab=b;b.held=true}
    else{var nb=spawn(P.x,P.y,rnd(-80,80),rnd(-40,40));void nb;holdT=0}
  });
  cv.addEventListener('pointermove',pos);
  function up(){P.down=false;if(grab){grab.held=false;grab=null}}
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

  function press(group,attr,cb){
    group.addEventListener('click',function(e){
      var t=e.target.closest('button');if(!t)return;
      [].forEach.call(group.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',x===t)});
      cb(t.getAttribute(attr));
    });
  }
  press(document.getElementById('gw'),'data-w',function(v){wSel=v});
  press(document.getElementById('gm'),'data-m',function(v){mSel=v});

  function rain(){
    audio();
    for(var i=0;i<24;i++){
      if(!flip)spawn(rnd(30,W-30),-30-i*34-rnd(0,30),rnd(-60,60),rnd(0,120));
      else spawn(rnd(30,W-30),H-40-rnd(0,H*.35),rnd(-60,60),0);
    }
  }
  function shake(){
    audio();
    balls.forEach(function(b){
      var f=Math.pow(100/b.m,.2);
      b.vx+=rnd(-700,700)*f;b.vy+=-(flip?-1:1)*rnd(500,1200)*f;
    });
  }
  document.getElementById('rain').addEventListener('click',rain);
  document.getElementById('shake').addEventListener('click',shake);
  document.getElementById('clear').addEventListener('click',function(){balls=[];grab=null});
  var fb=document.getElementById('flip');
  fb.addEventListener('click',function(){flip=!flip;fb.setAttribute('aria-pressed',flip)});
  var sb=document.getElementById('snd');
  sb.addEventListener('click',function(){soundOn=!soundOn;sb.setAttribute('aria-pressed',soundOn);if(soundOn)audio()});
  addEventListener('keydown',function(e){
    if(e.key===' '&&e.target===document.body){e.preventDefault();shake()}
  });
  addEventListener('resize',resize);

  /* ---------- loop ---------- */
  var cnt=document.getElementById('count'),hint=document.getElementById('hint'),last=performance.now(),lastN=-1;
  function loop(now){
    var dt=Math.min(1/30,(now-last)/1000);last=now;
    if(P.down&&!grab){holdT+=dt;if(holdT>.07){holdT=0;spawn(P.x+rnd(-6,6),P.y+rnd(-6,6),rnd(-120,120),rnd(-60,60))}}
    var n=Math.max(1,Math.ceil(dt/(1/120))),sd=dt/n,i;
    for(i=0;i<n;i++)step(sd);
    for(i=0;i<balls.length;i++)balls[i].sq*=Math.exp(-11*dt);
    draw();
    if(balls.length!==lastN){lastN=balls.length;cnt.textContent=lastN+(lastN===1?' object':' objects');hint.style.opacity=lastN?0:1}
    requestAnimationFrame(loop);
  }
  /*EXPOSE*/
  resize();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
